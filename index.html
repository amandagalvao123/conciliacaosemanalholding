<style>
:root{
  --ink:#1B1733; --ink-2:#4A4568; --ink-3:#7B7796;
  --ground:#F4F4F8; --surface:#FFFFFF; --surface-2:#EDEDF4; --line:#DEDEE9;
  --roxo:#2D204E; --accent:#2D204E; --accent-soft:#EAE6F5;
  --ok:#1F7A4D; --ok-soft:#E1F3E9;
  --warn:#B4600A; --warn-soft:#FBEEDC;
  --crit:#B81A20; --crit-soft:#FAE4E5;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEEDF6; --ink-2:#B4B0CC; --ink-3:#807C9C;
    --ground:#131120; --surface:#1D1A2E; --surface-2:#272339; --line:#332E4B;
    --roxo:#B9A6E8; --accent:#B9A6E8; --accent-soft:#2A2444;
    --ok:#6FD39E; --ok-soft:#173226;
    --warn:#E8A951; --warn-soft:#33260F;
    --crit:#F08A8E; --crit-soft:#3A1B1D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#EEEDF6; --ink-2:#B4B0CC; --ink-3:#807C9C;

}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.money,.dt{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.wrap{max-width:1280px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:18px}

/* topo */

.989-72 e 24/09 à Amiz Foods Comércio. A conta do favorecido estava bloqueada, a reemissão foi autorizada e os dois débitos estão confirmados.","Os dois pagamentos têm registro próprio no contas a pagar e os dois débitos estão no extrato — a conciliação fecha 1:1, sem estorno pendente."],"acao":"Nenhuma. O centro de custo de reembolso da semana fica com R$ 834,94 por um reembolso de R$ 417,47, o que é esperado dado o que aconteceu.","foco":false},{"tier":"ok","titulo":"Resolvido: o R$ 1,20 da semana 38","tag":"Fechado","paras":["No fechamento anterior o extrato acumulava R$ 7,89 em 18/09 e o disponível em 21/09 era R$ 6,69. A diferença de R$ 1,20 ficou em aberto.","Ela aparece agora: tarifa de baixa de títulos de R$ 1,20, primeiro lançamento de 21/09. O saldo de abertura também confere exatamente com o fechamento anterior — terceira conta com continuidade provada."],"acao":"Nenhuma. A pendência da semana 38 pode ser baixada."},{"tier":"ok","titulo":"EPI vendido à RETI — crédito localizado","tag":"Resolvido","paras":["O crédito estava dentro da liquidação de R$ 503,48 de 22/09. O borderô da carteira de cobrança mostra dois títulos liquidados em 21/09: R$ 199,88 da RETI, referente ao EPI, e R$ 303,60 da Ludo Alimentos. Somados, dão exatamente os R$ 503,48.","Aprendizado para a rotina: o Sicredi agrupa as liquidações de boleto do dia numa única linha de LIQ.COBRANCA SIMPLES. Recebimento por boleto não aparece título a título no extrato — para conferir um valor específico é preciso abrir o borderô."],"acao":"Marcar o lançamento como intercompany nos dois lados, para ser eliminado na consolidação do grupo.","foco":false},{"tier":"crit","titulo":"Tarifas de carteira de cobrança sem registro","tag":"R$ 50,98","paras":["Oito lançamentos na semana — manutenção de títulos, baixa de títulos e tarifa com registro de liquidação. Nenhum tem contrapartida no contas a pagar. Na semana 38 foram R$ 158,08; agora R$ 50,98.","Em duas semanas, R$ 209,06 de custo de carteira que não existe em nenhum relatório de despesa da distribuidora."],"acao":"Criar o centro de custo de tarifas bancárias e lançar semanalmente. A recomendação já vale para RETI, AVI e MARLAY.","foco":true},{"tier":"ok","titulo":"Ana Paula e Marcos: de-para confirmado","tag":"Esclarecido","paras":["Os registros em nome de Ana Paula Marcondes de Souza (R$ 1.780,00 e R$ 840,00) referem-se ao freelance do Marcos no CD. Ana Paula é irmã dele e recebe por ele — a correspondência está confirmada como correta.","Fica registrada como convenção de cadastro para não voltar como item a corrigir nos próximos fechamentos, como já foi feito com Márcia Cristina e Gabriel Jorge."],"acao":"Nenhuma. Se em algum momento o cadastro puder ficar no nome do Marcos com o CPF de quem recebe anotado, a conciliação passa a casar sozinha.","foco":false},{"tier":"warn","titulo":"Prolar pago a menor que o registrado","tag":"R$ 0,02","paras":["Registrado R$ 383,35, boleto liquidado por R$ 383,33. Terceiro resíduo de centavos da rotina, depois do IPTU de Rolândia (R$ 1,16) e da NG Telecom (R$ 0,10)."],"acao":"Ajustar o registro para o valor pago. Vale checar se a diferença vem de desconto ou de arredondamento na emissão.","foco":true},{"tier":"warn","titulo":"Frigorífico Astra cadastrado sob dois nomes","tag":"R$ 28.091,47","paras":["Dois registros com o mesmo CNPJ 07.615.913/0002-42: um como Astra (R$ 10.012,35) e outro como Frigorífico Astra (R$ 18.079,12). Somados, é o segundo maior fornecedor da semana, com 14% do desembolso — mas aparece dividido em dois nos relatórios.","Os oito maiores fornecedores concentram 67,2% da semana."],"acao":"Unificar o cadastro pelo CNPJ. Sem isso, a curva de fornecedores da distribuidora sai distorcida.","foco":false},{"tier":"ok","titulo":"Compra de R$ 17.256,99 a pessoa física — confirmada","tag":"Confirmado","paras":["O terceiro maior pagamento da semana, 8,6% do desembolso, foi por PIX ao CPF 110.478.599-47 e está classificado como compra de mercadoria. A operação está confirmada como correta pela Assessoria.","Registrado como fornecedor conhecido para não voltar como item a corrigir nos próximos fechamentos."],"acao":"Nenhuma.","foco":false},{"tier":"neutral","titulo":"Palmieri Foods entrou como pagador","tag":"R$ 5.124,24","paras":["Além das 17 lojas, apareceu um repasse da Palmieri Foods (CNPJ 54.436.601/0001-70) em 23/09. Na semana 38 os repasses vieram só das 17 lojas.","A cobertura de caixa da conta mudou de patamar: as entradas cobriram 134% das saídas, contra 41,6% na semana anterior, e o saldo saiu de R$ 7,89 para R$ 68.228,33."],"acao":"Nenhuma. Confirmar se a Palmieri passa a repassar de forma recorrente, para entrar na previsão de caixa."},{"tier":"ok","titulo":"Márcia Cristina e Gabriel Jorge: de-para confirmado","tag":"Convenção","paras":["Os registros em nome de Márcia Cristina Cardoso são pagos a Gabriel Jorge Cardoso Varasckim, e essa correspondência está confirmada como correta.","Fica registrada como convenção de cadastro para não voltar como divergência nos próximos fechamentos."],"acao":"Nenhuma. Se o cadastro puder ser gravado no nome do Gabriel com o CPF, a conciliação passa a casar sozinha."}],"pendencias":3,"pendenciasAbertas":["Tarifas de carteira R$ 50,98 sem registro — criar centro de custo","Prolar: ajustar registro de R$ 383,35 para os R$ 383,33 pagos","Unificar cadastro do Frigorífico Astra pelo CNPJ"],"wpp":"*CONCILIAÇÃO SEMANAL — AVI (Vespa Distribuidora)*\nPeríodo: 20 a 25/09/2026 · Conta Sicredi 65745-8\n\n*Resultado:* 83 de 83 registros conciliados.\n\n• Contas a pagar registrado: R$ 200.150,12\n• Débitos operacionais no banco: R$ 200.150,10\n• Recebido: R$ 268.421,52 · Saldo: R$ 7,89 -> R$ 68.228,33\n\n*VALOR A RECUPERAR — R$ 417,47*\nO reembolso do Gecionil saiu duas vezes (23/09 ao CPF dele, 24/09 à Amiz Foods). A reemissão está esclarecida: a conta dele estava bloqueada e a segunda tentativa foi autorizada — processo correto. O que falta é o estorno da primeira: o débito de 23/09 saiu e *não voltou dentro da semana*. Acompanhar na conciliação de 26 a 28/09 e contestar no banco se não entrar.\n\n*Caixa recuperou:* as entradas cobriram 134% das saídas, contra 41,6% na semana passada. Entrou um repasse novo, da Palmieri Foods (R$ 5.124,24).\n\n*Pontos para tratar:*\n1. O EPI de R$ 199,88 que a RETI pagou por boleto da AVI *não aparece* nesta conta — operação entre empresas registrada só de um lado\n2. Tarifas de carteira R$ 50,98 em 8 lançamentos, sem registro (R$ 209,06 em duas semanas)\n3. R$ 2.620,00 de freelance pagos à Ana Paula sendo o serviço do Marcos — cadastrar o Marcos em nome próprio (o caso Márcia/Gabriel está esclarecido)\n4. Frigorífico Astra está cadastrado com dois nomes e mesmo CNPJ — somados são 14% da semana\n6. Prolar: registrado R$ 383,35, pago R$ 383,33\n\n*Resolvido:* o R$ 1,20 da semana passada era tarifa de baixa de títulos de 21/09. Saldo de abertura bate exato com o fechamento anterior.","composicaoDif":[{"tipo":"sem-registro","dt":"21/09","desc":"Tarifa baixa de títulos","v":1.2},{"tipo":"sem-registro","dt":"21/09","desc":"Manutenção de títulos","v":28.2},{"tipo":"sem-registro","dt":"21/09","desc":"Tarifa com r liquidação","v":1.19},{"tipo":"sem-registro","dt":"21/09","desc":"Tarifa com r liquidação","v":1.19},{"tipo":"sem-registro","dt":"22/09","desc":"Manutenção de títulos","v":10.2},{"tipo":"sem-registro","dt":"22/09","desc":"Tarifa baixa de títulos","v":1.2},{"tipo":"sem-registro","dt":"23/09","desc":"Tarifa baixa de títulos","v":0.6},{"tipo":"sem-registro","dt":"25/09","desc":"Manutenção de títulos","v":7.2},{"tipo":"menor","dt":"21/09","desc":"Prolar — registrado R$ 383,35, pago R$ 383,33","v":-0.02}]},{"id":"marlay-2026-09-20","ordem":20260920,"conta":"marlay","contaLabel":"MARLAY","contaDetalhe":"ML Consultoria · Sicredi 66328-3","cor":"#5B3E8E","razaoSocial":"ML Consultoria em Food Service Ltda","periodoLabel":"20–25/09/2026","periodoInicio":"2026-09-20","periodoFim":"2026-09-25","emitido":"2026-09-28","semana":39,"chama zão social, Depósito São Marcos, R L de Matos, Dicomag, Logmoveleira, Inglaterra e Rovano. Todos com valor e data corretos.","É a mesma observação da semana 38 e continua sem resolução: sem campo de fornecedor com CNPJ, o de-para desta conta depende de ler a descrição de cada registro."],"acao":"Acrescentar campo de fornecedor com CNPJ ao cadastro por obra.","foco":false},{"tier":"neutral","titulo":"Dois pagadores novos na conta","tag":"R$ 22.784,96","paras":["Além das 17 lojas, entraram Maanaim Empreendimentos Imobiliários (dois PIX de R$ 10.000,00 em 22/09) e Big Fome Lanches (R$ 2.784,96 em 22/09). Nenhum dos dois aparecia na semana 38.","Juntos representam 24,5% de tudo que entrou na conta na semana."],"acao":"Confirmar a natureza dos dois recebimentos e se são recorrentes, para entrar na previsão de caixa."},{"tier":"neutral","titulo":"Cesta empresarial agendada","tag":"R$ 39,50 · 15/10","paras":["Segue nos lançamentos futuros do extrato a cesta empresarial de R$ 39,50 para 15/10."],"acao":"Lançar no contas a pagar de outubro."}],"pendencias":6,"pendenciasAbertas":["Santander: ajustar parcelas do acordo — pago R$ 18,38 acima do registrado","Multcabos: ajustar registro de R$ 1.311,37 para os R$ 1.311,50 pagos","Registrar a cessão dos boletos do Gesso Top Line à Athos Fomento","Unificar cadastro de Superar Refrigerações / Super Ar / Alison Aparecido","Acrescentar campo de fornecedor com CNPJ ao cadastro por obra","Confirmar natureza dos recebimentos da Maanaim e da Big Fome"],"wpp":"*CONCILIAÇÃO SEMANAL — MARLAY (ML Consultoria)*\nPeríodo: 20 a 25/09/2026 · Conta Sicredi 66328-3\n\n*Resultado:* 35 de 35 registros conciliados. Continuidade confirmada e *sem nenhum resíduo de saldo* — o calculado em 25/09 é idêntico ao disponível em 28/09.\n\n• Contas a pagar registrado: R$ 108.030,34\n• Débitos no banco: R$ 108.048,85\n• Diferença: R$ 18,51 (dois boletos pagos acima do registrado)\n• Saldo: R$ 75.994,24 -> R$ 61.082,10\n\n*A CONTA MUDOU DE PERFIL*\nNa semana passada, 76% do desembolso era sócio e investimento. Nesta semana: *zero*. 79,9% foi expansão — aluguéis das unidades (R$ 38.997,01) e obra do Sunset Mall (R$ 20.736,37) são dois terços disso.\n\n*Pontos para tratar:*\n1. *Acordo Santander:* parcela registrada em R$ 918,98 e paga em R$ 937,36 (R$ 18,38 a mais, ~2%). Maior divergência de valor desde o início. Se repetir nas 9 parcelas, são ~R$ 165\n2. Boletos do *Gesso Top Line* (R$ 4.781,97) foram cedidos à Athos Fomento — segundo caso de factoring na rotina. Orçamento total R$ 19.518,00 em 4 boletos\n3. *Superar Refrigerações / Super Ar / Alison Aparecido* é o mesmo prestador cadastrado três vezes, recebendo ora no CNPJ, ora no CPF\n4. Multcabos: registrado R$ 1.311,37, pago R$ 1.311,50\n5. Entraram dois pagadores novos: Maanaim Imobiliária (R$ 20.000,00) e Big Fome (R$ 2.784,96) — 24,5% do que entrou","composicaoDif":[{"tipo":"maior","dt":"23/09","desc":"Acordo Santander — registrado R$ 918,98, pago R$ 937,36","v":18.38},{"tipo":"maior","dt":"22/09","desc":"Multcabos — registrado R$ 1.311,37, pago R$ 1.311,50","v":0.13}]},{"id":"mkt-2026-09-20","ordem":20260920,"conta":"mkt","contaLabel":"MKT & VENDAS","contaDetalhe":"Ragga MKT & Vendas · conta 520213530","cor":"#E86820","razaoSocial":"Ragga MKT & Vendas","periodoLabel":"20–25/09/2026","periodoInicio":"2026-09-20","periodoFim":"2026-09-25","emitido":"2026-09-28","semana":39,"chamada":"9 de 9 registros conciliados, diferença zero e nenhuma tarifa — segunda semana seguida sem divergência de valor nesta conta. E pela primeira vez deu para provar a continuidade: o saldo de abertura bate exatamente com o fechamento da semana anterior.","saldoAnterior":159613.75,"debitos":9065.53,"creditos":63316.53,"saldoFinal":213864.75,"saldoInformado":213864.75,"totalCP":9065.53,"debitoLiquido":9065.53,"diferenca":0.0,"registros":9,"conciliados":9,"lancamentos":63,"tarifasTotal":0,"creditosLojas":63316.53,"kpis":[{"k":"Conciliado","v":"9 / 9","d":"100% dos registros localizados","tone":" ,"foco":false},{"tier":"ok","titulo":"Diretor de MKT — enquadramento confirmado","tag":"Confirmado","paras":["O pagamento mensal de R$ 15.000,00 ao diretor de MKT está na rubrica salário PJ e sai ao CPF. A forma está confirmada como correta pela Assessoria.","Registrado como convenção para não voltar como item a corrigir nos próximos fechamentos."],"acao":"Nenhuma.","foco":false},{"tier":"ok","titulo":"Software mensal a pessoa física — confirmado","tag":"Confirmado","paras":["O recorrente de R$ 5.000,00 em sistema/software pago por PIX a pessoa física está confirmado como correto pela Assessoria.","Registrado como convenção. Preencher a descrição do registro continua sendo útil para quem consultar a planilha depois, mas não é pendência."],"acao":"Nenhuma.","foco":false},{"tier":"ok","titulo":"EPI comprado da AVI — contrapartida confirmada","tag":"Resolvido","paras":["A RETI liquidou em 21/09 um boleto de R$ 199,88 emitido pela AVI, referente a EPI. A contrapartida foi localizada: o Sicredi agrupa as liquidações de boleto numa única linha de crédito, e o borderô da AVI de 22/09 mostra o título de R$ 199,88 liquidado em 21/09, somado a R$ 303,60 da Ludo Alimentos — os R$ 503,48 creditados.","A operação entre empresas está amarrada nas duas pontas."],"acao":"Marcar o lançamento como intercompany nos dois lados, para ser eliminado quando as contas do grupo forem consolidadas.","foco":false},{"tier":"crit","titulo":"NG Telecom pago a maior","tag":"R$ 0,10","paras":["Registrado R$ 344,70, boleto liquidado por R$ 344,80. É a única divergência de valor da semana e o mesmo tipo de resíduo que apareceu no IPTU de Rolândia na MARLAY."],"acao":"Ajustar o registro para o valor pago. Se for atualização monetária do boleto, vale registrar como tal.","foco":true},{"tier":"warn","titulo":"Manutenção de títulos fora do contas a pagar","tag":"R$ 1,00","paras":["A tarifa de R$ 1,00 de 21/09 não tem registro. É o mesmo tipo de lançamento que a AVI acumula semanalmente e que segue sem centro de custo próprio.","A cesta empresarial de R$ 79,00 já aparece agendada para 15/10 nos lançamentos futuros."],"acao":"Criar o centro de custo de tarifas bancárias — a recomendação já vale para RETI, AVI e MARLAY.","foco":true},{"tier":"warn","titulo":"Rocha & Rocha pago a Gustavo Capelo Sociedade de Advogados","tag":"Cadastro","paras":["O favorecido no banco não é o nome cadastrado, mas neste caso a descrição do registro já traz o CNPJ 47.766.474/0001-02, que confere com o extrato. É exatamente a prática que venho sugerindo para os demais fornecedores."],"acao":"Gravar a razão social no cadastro. O CNPJ já está e resolveu a conferência.","foco":false},{"tier":"ok","titulo":"Critério: o fechamento vai até 25/09","tag":"Definido","paras":["A janela conciliada de cada semana vai do primeiro ao último dia do período — aqui, até 25/09. O saldo que o banco informa depois disso, na data em que o extrato foi puxado, fica fora do fechamento.","Por definição da Assessoria, esse saldo posterior não entra mais como item a conferir: o que saiu entre 26 e 28/09 pertence ao fechamento da semana seguinte e será conciliado lá."],"acao":"Nenhuma. Critério aplicado em todas as contas a partir deste fechamento.","foco":false}],"pendencias":3,"pendenciasAbertas":["NG Telecom: ajustar registro de R$ 344,70 para os R$ 344,80 pagos","Criar centro de custo de tarifas bancárias","Gravar razão social de Rocha & Rocha no cadastro"],"wpp":"*CONCILIAÇÃO SEMANAL — RETI (Ragga Gestão)*\nPeríodo: 20 a 25/09/2026 · Conta Sicredi 65737-0\n\n*Resultado:* 29 de 29 registros conciliados.\n\n• Contas a pagar registrado: R$ 91.573,44\n• Débitos operacionais no banco: R$ 91.573,54\n• Diferenças: R$ 1,00 de tarifa sem registro + R$ 0,10 no boleto da NG Telecom\n• Recebido das lojas: R$ 175.879,71 (77 PIX de 17 lojas)\n• Saldo: R$ 57.317,02 -> R$ 141.622,19\n\n*PENDÊNCIA DA SEMANA PASSADA RESOLVIDA*\nAquele R$ 1,00 que não fechava no saldo era uma manutenção de títulos debitada em 21/09. O saldo de abertura também bate exato com o fechamento anterior — continuidade confirmada.\n\n*Pontos para tratar:*\n1. *Voxel R$ 40.175,28* é 43,9% da semana. Com os demais, sistema/software chega a 54%. O registro recorrente não tem contrato nem escopo anexado\n2. *Diretor MKT R$ 15.000,00* está na rubrica salário PJ mas foi pago ao CPF — alinhar enquadramento com a contabilidade, o registro se repete todo mês\n3. *R$ 5.000,00 mensais* em sistema/software pagos a pessoa física, sem nenhuma descrição no registro — único lançamento da semana sem detalhamento\n4. *EPI de R$ 199,88* registrado como Vespa foi boleto da AVI: compra entre empresas do grupo, precisa estar espelhada nas duas pontas\n5. NG Telecom: registrado R$ 344,70 e pago R$ 344,80","composicaoDif":[{"tipo":"sem-registro","dt":"21/09","desc":"Manutenção de títulos","v":1.0},{"tipo":"maior","dt":"25/09","desc":"NG Telecom — registrado R$ 344,70, pago R$ 344,80","v":0.1}]},{"id":"social-2026-09-20","ordem":20260920,"conta":"social","contaLabel":"RAGGA SOCIAL","contaDetalhe":"Ragga Social · conta digital","cor":"#8A2040","razaoSocial":"Ragga Social","periodoLabel":"20–25/09/2026","periodoInicio":"2026-09-20","periodoFim":"2026-09-25","emitido":"2026-09-28","semana":39,"chamada":"Duas movimentações na semana, ambas conciliadas 1:1. Diferença zero e nenhuma tarifa. O único ponto aberto é o extrato sem coluna de saldo — segunda semana seguida — o que impede amarrar a posição da conta.","saldoAnterior":null,"debitos":5896.54,"creditos":0,"saldoFinal":null,"saldoInformado":null,"totalCP":5896.54,"debitoLiquido":5896.54,"diferenca":0.0,"registros":2,"conciliados":2,"lancamentos":2,"tarifasTotal":0,"kpis":[{"k":"Conciliado","v":"2 / 2","d":"Registros localizados no extrato","tone":"hero"},{"k":"Contas a pagar","v":"5.896,54","d":"Registrado e marcado como pago"},{"k":"Débitos no banco","v":"5.896,54","d":"Dois lançamentos no período"},{"k":"Diferença","v":"0,00","d":"Sem tarifa no período","tone":"hero"}],"leitura":[{"txt":"Con gir nos próximos fechamentos."],"acao":"Nenhuma. Se o CNPJ da Gamel puder ser gravado no cadastro, a conciliação passa a casar sozinha.","foco":false},{"tier":"warn","titulo":"Extrato sem coluna de saldo — segunda semana","tag":"Processo","paras":["O arquivo veio de novo com apenas data, valor, identificador e descrição. Dá para conferir os lançamentos, mas não dá para amarrar saldo anterior e saldo final — a checagem que garante que nenhum lançamento ficou de fora do período.","Nas outras contas é justamente essa amarração que prova que o extrato está completo. Aqui, a conciliação vale pelos lançamentos que existem no arquivo, não pela certeza de que são todos."],"acao":"Exportar o extrato desta conta com saldo, no mesmo formato das demais. Enquanto não vier, o fechamento da Ragga Social fica com um grau de garantia menor que o das outras contas.","foco":false},{"tier":"warn","titulo":"Pendências da semana 38 ainda abertas","tag":"2 itens","paras":["Seguem sem baixa os dois pontos levantados no fechamento anterior desta conta: o dado pessoal sensível no campo livre de descrição do contas a pagar, e o enquadramento da rubrica ajuda de custo junto à contabilidade e ao DP.","Nenhum dos dois aparece nesta semana porque não houve lançamento do tipo, mas continuam pendentes de tratamento."],"acao":"Ver o fechamento de 14–18/09 nesta mesma aba para o detalhe de cada um.","foco":false},{"tier":"neutral","titulo":"Metrópole atende duas empresas do grupo","tag":"Mesmo CNPJ","paras":["A Metrópole Apoio Administrativo (CNPJ 51.492.863/0001-64) recebeu R$ 472,57 de honorários aqui e R$ 3.675,00 pela MARLAY na semana 38, em serviço de alteração de endereço de CNPJ.","Não é divergência — é o mesmo prestador atendendo empresas diferentes da holding, cada uma pagando pela sua conta."],"acao":"Nenhuma. Registro útil para consolidar o gasto com contabilidade por prestador quando o fechamento mensal for montado."}],"pendencias":2,"pendenciasAbertas":["Exportar o extrato desta conta co "foco":true},{"tier":"crit","titulo":"Facão pago a dois CPFs diferentes","tag":"R$ 1.260,00","paras":["O fornecedor FACÃO teve três pagamentos na semana. Dois foram para José Luiz Silvério (CPF 039.961.898-85): R$ 3.700,00 e R$ 1.100,00. O de R$ 1.260,00, em 14/09, foi para João Batista Silvério (CPF 624.114.548-72) — outra pessoa, outro documento, mesmo fornecedor no cadastro."],"acao":"Confirmar se são dois fornecedores distintos usando o mesmo apelido. Se forem, separar o cadastro.","foco":true},{"tier":"crit","titulo":"Boletos da Lukachaki cedidos a factoring","tag":"R$ 6.498,34","paras":["Os três boletos da Lukachaki (R$ 1.906,25 · 2.108,75 · 2.483,34) foram liquidados em nome da Real Forte Fomento Mercantil (CNPJ 04.275.671/0001-16). O fornecedor cedeu os títulos, então o pagamento quita a duplicata mas o dinheiro não vai para ele."],"acao":"Registrar a cessão no cadastro da Lukachaki e guardar o aceite. Em cessão de crédito, pagar ao fornecedor original não quita a dívida.","foco":true},{"tier":"ok","titulo":"Márcia Cristina e Gabriel Jorge: de-para confirmado","tag":"Esclarecido","paras":["Os pagamentos registrados como Márcia Cristina Cardoso saíram para Gabriel Jorge Cardoso Varasckim (R$ 120,00 + 240,00 + 120,00). A correspondência entre os dois nomes está confirmada como correta."],"acao":"Nenhuma. Se o cadastro puder ser gravado no nome do Gabriel com o CPF, a conciliação passa a casar sozinha."},{"tier":"warn","titulo":"Dois casos de razão social sem relação aparente","tag":"R$ 537,89","paras":["Alimentos Wilson → boleto liquidado em nome de RED S.A. (CNPJ 67.915.785/0001-01), R$ 403,81. Macro Vida → PIX para Gouvêa Delivery Ltda (CNPJ 47.444.103/0001-04), R$ 134,08."],"acao":"Confirmar a razão social de cada um e gravar o CNPJ no cadastro.","foco":true},{"tier":"warn","titulo":"Razão social × nome fantasia","tag":"24 casos","paras":["Frigolon → Constantino e Sentinello, Levo → Plusval Agroavícola, Barracão Vespa → S E Administradora, Sr Bacon → D.K.C. áfego e rádio, a mídia chega a R$ 22.390,00: 75,3% de tudo que saiu."],"acao":"Vale amarrar esses valores ao retorno por unidade — a Marcela está vinculada à Mapoli e a Duda a Biggs/Robs, então dá para medir.","foco":false},{"tier":"warn","titulo":"Nome divergente em cadastro de fornecedor","tag":"2 casos","paras":["Nova Supri → Daniele Alexandre Cordeiro Gráfica e Papelaria (boleto de cartões e envelopes) e Duda Giachetto → Maria Eduarda Giachetto, CNPJ 57.775.094/0001-98 (nome artístico contra nome civil). Valores e datas corretos."],"acao":"Gravar razão social e CNPJ no cadastro.","foco":false},{"tier":"ok","titulo":"Única conta sem tarifa bancária","tag":"R$ 0,00","paras":["Nenhum lançamento de tarifa no período. As três contas Sicredi pagaram cesta de relacionamento na mesma semana: RETI R$ 79,00, AVI R$ 79,00 e MARLAY R$ 39,50, mais R$ 79,08 de carteira de cobrança na AVI."],"acao":"Nenhuma aqui. Serve de comparação ao renegociar o pacote das contas Sicredi."}],"pendencias":4,"pendenciasAbertas":["Cadastrar Meta/Facebook como fornecedor próprio — R$ 1.500,00 registrados na Setalab","Definir natureza do pagamento à CBM Consultoria: reembolso a PF ou serviço a PJ (R$ 217,86)","Registrar as duas pontas do cartão PF da Amanda (bruto e estorno) — padrão repetido em RETI e MKT","Gravar razão social e CNPJ no cadastro: Nova Supri e Duda Giachetto"],"wpp":"*CONCILIAÇÃO SEMANAL — RAGGA MKT & VENDAS*\nPeríodo: 14/09 a 18/09/2026 · Conta 520213530\n\n*Resultado:* 11 de 11 registros conciliados. *Diferença zero* e nenhuma tarifa sem registro — a conciliação mais limpa das quatro contas.\n\n• Contas a pagar registrado: R$ 29.741,07\n• Débito líquido no banco: R$ 29.741,07\n\n*Saldo:* R$ 189.354,82 -> R$ 159.613,75\n\n*ACHADO: Maria Fernanda encontrada*\nO PIX de R$ 478,50 que faltava para fechar a lista de horas extras do DP saiu desta conta em 18/09. A lista fecha 100%: R$ 8.046,83 pela RETI + R$ 478,50 pela MKT = R$ 8.525,33. Pode baixar a pendência da RETI.\n\n*Onde foi a de valor.\n\n• Contas a pagar registrado: R$ 44.519,77\n• Débito líquido no banco: R$ 44.598,77\n• Diferença: R$ 79,00 (cesta de relacionamento, sem registro)\n\n*Saldo:* R$ 101.915,79 -> R$ 57.317,02 em 18/09\n\n*FOLHA / HORAS EXTRAS*\nO registro único de R$ 8.046,83 saiu em 10 PIX individuais. Confrontei com a lista do DP: os 10 nomes RAGGA conferem um a um. A lista tem R$ 8.525,33, sendo R$ 478,50 da Maria Fernanda (empresa MEL) que saiu pela conta da MKT & Vendas (conferido). Pagamento à vista confirmado.\n\n*EM ABERTO:*\n1. Maria Eduarda Alves pediu para não receber, mas os R$ 965,94 saíram em 18/09 — definir se estorna ou reabre o banco de horas\n2. Conferir se as parcelas de out/nov foram lançadas no contas a pagar\n3. Cesta de relacionamento R$ 79,00 — cadastrar como recorrente\n4. Registrar o estorno de R$ 1.497,59 do reembolso da Amanda\n5. Nomes divergentes: Muth/Londrimuth, Muth/Capemisa, ACF ID/Paraná Cards\n6. Saldo em 21/09 R$ 1,00 abaixo — puxar extrato de 19 a 21/09","composicaoDif":[{"tipo":"sem-registro","dt":"15/09","desc":"Cesta de relacionamento","v":79.0}]},{"id":"social-2026-09-14","ordem":20260914,"conta":"social","contaLabel":"RAGGA SOCIAL","contaDetalhe":"Ragga Social · conta digital","cor":"#8A2040","razaoSocial":"Ragga Social","periodoLabel":"14–18/09/2026","periodoInicio":"2026-09-14","periodoFim":"2026-09-18","emitido":"2026-09-21","semana":38,"chamada":"Uma única movimentação na semana, conciliada 1:1 com o registro. Diferença zero. Dois pontos de processo: o extrato enviado não traz saldo, e a descrição do registro guarda um dado pessoal sensível que não deveria estar numa planilha financeira.","saldoAnterior":null,"debitos":1550.02,"creditos":0,"saldoFinal":null,"saldoInformado":null,"totalCP":1550.02,"debitoLiquido":1550.02,"diferenca":0.0,"registros":1,"conciliados":1,"lancamentos":1,"tarifasTotal":0,"kpis":[{"k":"Conciliado","v":"1 / 1","d":"Registro localizado no extrato","tone":"hero"},{"k":"Contas a pagar","v":"1.550,02","d" édica) e o valor, que é o que a conciliação precisa."],"acao":"Manter na planilha financeira apenas a natureza e o valor. O detalhe do caso, se precisar ser guardado, fica em prontuário ou pasta de RH com acesso restrito, referenciado por um número de protocolo. Vale rodar a mesma revisão nas outras contas — este tipo de detalhe costuma aparecer em campo livre de reembolso.","foco":true},{"tier":"warn","titulo":"Natureza da ajuda de custo a confirmar","tag":"R$ 1.550,02","paras":["O pagamento foi feito direto ao CPF do colaborador, com a rubrica ajuda de custo. Dependendo de como está formalizado, um valor assim pode ser lido como utilidade de natureza salarial, com reflexo em encargos e verbas rescisórias, ou como benefício ou liberalidade sem esse efeito.","Não sou contador nem advogado, então trato isso como ponto a validar, não como conclusão."],"acao":"Confirmar com a contabilidade e o DP como a rubrica está enquadrada e se há política escrita de ajuda de custo. Se houver, referenciar a política no registro.","foco":false},{"tier":"warn","titulo":"Extrato sem coluna de saldo","tag":"Processo","paras":["O arquivo enviado tem apenas data, valor, identificador e descrição. Dá para conferir o lançamento, mas não dá para amarrar saldo anterior e saldo final — que é a checagem que garante que nenhum lançamento ficou de fora do período.","Nas outras quatro contas essa amarração é o que provou que o extrato estava completo."],"acao":"Exportar o extrato desta conta com saldo, no mesmo formato das demais, para o fechamento ficar no mesmo padrão.","foco":false},{"tier":"neutral","titulo":"Ordem do sobrenome invertida","tag":"Cadastro","paras":["Cadastro traz Silas Dias Barbosa; o banco, Silas Barbosa Dias. Mesmo CPF, mesmo valor, mesma data — é só a ordem do sobrenome."],"acao":"Ajustar o cadastro para o nome como consta no documento, e gravar o CPF."}],"pendencias":4,"pendenciasAbertas":["Remover o detalhe de saúde da descrição no contas a pagar e revisar campos livres das outras contas (LGPD)","Confirmar com contabilidade e DP o enquadramento da rubrica ajuda de custo","Exportar o extrato desta conta com coluna de saldo","Ajustar nome e gravar CPF no cadastro do colaborador"],"wpp":"*CONCILIAÇÃO SEMANAL — RAGGA SOCIAL*\nPeríodo: 14/09 a 18/09/2026\n\n*Resultado:* 1 de 1 registro conciliado. Diferença zero.\n\n• Contas a pagar registrado: R$ 1.550,02\n• Débito no banco: R$ 1.550,02\n• Ajuda de custo paga em 17/09 via PIX ao CPF do colaborador\n\n*Pontos para tratar:*\n1. *LGPD* — a descrição do registro no contas a pagar detalha condição de saúde de um colaborador identificado. Isso é dado pessoal sensível e não deveria estar numa planilha que circula entre financeiro, contabilidade e diretoria. Sugiro deixar só a natureza e o valor, e guardar o detalhe em pasta de RH com acesso restrito. Vale revisar os campos livres das outras contas também.\n2. Confirmar com contabilidade e DP o enquadramento da rubrica ajuda de custo (se tem ou não reflexo trabalhista)\n3. O extrato desta conta veio sem coluna de saldo — sem ela não dá para amarrar a posição e garantir que nada ficou de fora do período\n4. Cadastro está como Silas Dias Barbosa e o banco traz Silas Barbosa Dias — ajustar e gravar o CPF","composicaoDif":[]}];

<script>
(function(){
  "use strict";
  var brl=function(n){return (n==null)?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined&&x!==null)e.textContent=x;return e;}
  function card(){return el('section','card');}
  function h2(p,t,s){p.appendChild(el('h2',null,t));if(s)p.appendChild(el('p','sub',s));}

  var DOCS=[], conta='holding', periodo=null;
  var DB=null, STATUS={}, filtroConta='todas';
  function slug(t){
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
            .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'item';
  }
  function chaveDe(d,p){ return d.id+'--'+slug(p.titulo); }
  function feito(d,p){ var r=STATUS[chaveDe(d,p)]; return !!(r&&r.resolvido); }
  function marcar(d,p,val,cb){
    var k=chaveDe(d,p);
    STATUS[k]={resolvido:val, em:new Date().toISOString()};
    if(cb) cb();
    if(!DB) return;
    try{
      DB.doc('status/'+k).set({resolvido:val, em:new Date().toISOString(),
        conta:d.conta, periodo:d.periodoLabel, titulo:p.titulo}).catch(function(){});
    }catch(e){}
  }
  function dataBR(iso){
    try{ var x=new Date(iso); return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear(); }
    catch(e){ return ''; }
  }
  var tabsEl=document.getElementById('tabs'), perEl=document.getElementById('periodos'),
      viewEl=document.getElementById('view'), statusEl=document.getElementById('dbStatus'),
      dotEl=document.getElementById('markDot'), subEl=document.getElementById('markSub');

  function periodos(){
    var seen={},out=[];
    DOCS.forEach(function(d){ if(!seen[d.periodoLabel]){seen[d.periodoLabel]=1;out.push({lbl:d.periodoLabel,ord:d.ordem||0});} });
    return out.sort(function(a,b){return b.ord-a.ord;});
  }
  function contas(){
    var seen={},out=[];
    DOCS.forEach(function(d){ if(!seen[d.conta]){seen[d.conta]=1;out.push({k:d.conta,lbl:d.contaLabel,cor:d.cor||'#2D204E'});} });
    return out;
  }
  function docAtual(){
    for(var i=0;i<DOCS.length;i++) if(DOCS[i].conta===conta && DOCS[i].periodoLabel===periodo) return DOCS[i];
    return null;
  }

  var drillAberto=null;
  function kpiBlock(p,kpis,onDrill){
    if(!kpis||!kpis.length) return;
    var g=el('div','kpis');
    kpis.forEach(function(k){
      var clic=!!(k.drill&&onDrill);
      var b=el(clic?'button':'div','kpi'+(k.tone?' '+k.tone:'')+(clic?' clic':'')+(clic&&drillAberto===k.drill?' on':''));
      if(clic){ b.type='button'; b.setAttribute('aria-expanded',drillAberto===k.drill?'true':'false'); }
      var kk=el('div','k',k.k);
      if(clic) kk.appendChild(el('span','car','›'));
      b.appendChild(kk);
      b.appendChild(el('div','v',k.v));
      if(k.d) b.appendChild(el('div','d',k.d));
      if(clic) b.addEventListener('click',function(){ onDrill(k.drill); });
      g.appendChild(b);
    });
    p.appendChild(g);
  }
  function amarrBlock(p,blocos){
    (blocos||[]).forEach(function(bloco){
      var box=el('div','amarr');
      bloco.forEach(function(r){
        var row=el('div','row'+(r.tipo?' '+r.tipo:''));
        var l=el('span','lbl',r.lbl);
        if(r.sub) l.appendChild(el('small',null,r.sub));
        if(r.tone==='warnv') l.style.color='var(--warn)';
        row.appendChild(l);
        var v=el('span','val '+(r.tone==='neg'?'neg':(r.tone==='pos'?'pos':'')),'R$ '+brl(r.val));
        if(r.tone==='warnv') v.style.color='var(--warn)';
        row.appendChild(v);
        box.appendChild(row);
      });
      p.appendChild(box);
    });
  }
  function barsBlock(p,items,cor,cap){
    var max=items.reduce(function(m,x){return Math.max(m,Math.abs(x[1]));},0)||1;
    var bars=el('div','bars');
    items.forEach(function(x){
      var b=el('div','bar');
      b.appendChild(el('div','bl',x[0]));
      var tk=el('div','track'),fl=el('div','fill');
      fl.style.width=Math.max(0.5,(Math.abs(x[1])/max)*100)+'%';
      fl.style.background=x[2]||cor;
      tk.appendChild(fl);b.appendChild(tk);
      b.appendChild(el('div','bv',brl(x[1])));
      bars.appendChild(b);
    });
    if(cap){var c=el('p','sub',cap);c.style.margin='0 0 12px';p.appendChild(c);}
    p.appendChild(bars);
  }
  function divsBlock(p,list){
    var box=el('div','divs');
    list.forEach(function(d){
      var w=el('div','dv '+(d.tier==='neutral'?'':d.tier));
      w.appendChild(el('div','stripe'));
      var b=el('div');
      var t=el('h3',null,d.titulo);
      if(d.tag) t.appendChild(el('span','tag t-'+(d.tier==='ok'?'ok':(d.tier==='crit'?'crit':(d.tier==='warn'?'warn':'neutral'))),d.tag));
      b.appendChild(t);
      (d.paras||[]).forEach(function(x){ b.appendChild(el('p',null,x)); });
      if(d.acao){ var a=el('p','acao'); a.appendChild(el('b',null,'Ação: ')); a.appendChild(document.createTextNode(d.acao)); b.appendChild(a); }
      w.appendChild(b); box.appendChild(w);
    });
    p.appendChild(box);
  }


  /* ---------- pendências derivadas + modal ---------- */
  function pendsDe(d){   /* o que precisa de correção: não conciliou, não bateu, ou é estranho */
    return (d.divergencias||[]).filter(function(x){return x.foco===true;});
  }
  function processoDe(d){ /* melhorias de cadastro e rotina — ficam fora da tela da holding */
    return (d.divergencias||[]).filter(function(x){
      return (x.tier==='crit'||x.tier==='warn') && x.foco!==true;
    });
  }
  var verProcesso=false;
  var ovlEl=null, lastFocus=null;
  function fecharModal(){
    if(!ovlEl) return;
    ovlEl.remove(); ovlEl=null;
    document.body.style.overflow='';
    document.removeEventListener('keydown',escHandler);
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function escHandler(e){ if(e.key==='Escape') fecharModal(); }
  function abrirModal(d,p){
    fecharModal();
    lastFocus=document.activeElement;
    var ovl=el('div','ovl');
    ovl.addEventListener('click',function(e){ if(e.target===ovl) fecharModal(); });
    var m=el('div','modal');
    m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.tabIndex=-1;
    var top=el('div','mtop');
    var left=el('div');
    var ct=el('div','mconta');
    var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
    ct.appendChild(cd);
    ct.appendChild(document.createTextNode(d.contaLabel+' · '+d.periodoLabel));
    left.appendChild(ct);
    var t=el('h3',null,p.titulo);
    if(p.tag) t.appendChild(el('span','tag t-'+(p.tier==='crit'?'crit':'warn'),p.tag));
    left.appendChild(t);
    top.appendChild(left);
    var x=el('button','xbtn','×'); x.type='button'; x.setAttribute('aria-label','Fechar');
    x.addEventListener('click',fecharModal);
    top.appendChild(x);
    m.appendChild(top);
    (p.paras||[]).forEach(function(tx){ m.appendChild(el('p',null,tx)); });
    if(p.acao){
      var box=el('div','acaobox');
      box.appendChild(el('div','al','Ação'));
      box.appendChild(el('p',null,p.acao));
      m.appendChild(box);
    }
    var foot=el('div','mfoot');
    var go=el('button','btn','Abrir a aba '+d.contaLabel); go.type='button';
    go.addEventListener('click',function(){ fecharModal(); conta=d.conta; render(); window.scrollTo(0,0); });
    foot.appendChild(go);
    var cl=el('button','btn','Fechar'); cl.type='button';
    cl.addEventListener('click',fecharModal);
    foot.appendChild(cl);
    m.appendChild(foot);
    ovl.appendChild(m);
    document.body.appendChild(ovl);
    document.body.style.overflow='hidden';
    document.addEventListener('keydown',escHandler);
    m.focus();
    ovlEl=ovl;
  }


  /* ---------- aberturas dos KPIs ---------- */
  var ROT={'sem-registro':'Lançamento no banco sem registro no contas a pagar',
           'maior':'Pago acima do valor registrado',
           'menor':'Pago abaixo do valor registrado'};
  function drillDiferenca(doArr,total){
    var box=el('div','drillbox');
    box.appendChild(el('h5',null,'Composição da diferença'));
    box.appendChild(el('p','hint2','Tudo que separa o que saiu do banco do que está registrado no contas a pagar. Valores negativos foram pagos abaixo do registrado e reduzem a diferença.'));
    var algum=false;
    doArr.forEach(function(d){
      var itens=d.composicaoDif||[];
      if(!itens.length) return;
      algum=true;
      var g=el('div','dgrp');

        tr.appendChild(el('td','r money',brl(r.v)));
        var s=el('td'); s.appendChild(el('span','tag t-'+r.tone,r.tag)); tr.appendChild(s);
        body2.appendChild(tr);
        if(hasDet){
          var ctr=el('tr','child'); ctr.hidden=true;
          var ctd=el('td'); ctd.colSpan=6;
          var dr=el('div','drill');
          dr.appendChild(el('h5',null,'Saídas consideradas'));
          if(r.how) dr.appendChild(el('p','how',r.how));
          var dt2=el('table','dtab'),dtb=el('tbody'),sm=0;
          r.det.forEach(function(x){
            sm+=x.v;
            var row=el('tr');
            row.appendChild(el('td',null,x.d));
            row.appendChild(el('td','dt',x.doc));
            var v=el('td','r money',(x.v<0?'− ':'')+brl(Math.abs(x.v)));
            if(x.v<0) v.style.color='var(--ok)';
            row.appendChild(v); dtb.appendChild(row);
          });
          var tot=el('tr','dtot');
          tot.appendChild(el('td',null,r.det.length+' saídas consideradas'));
          tot.appendChild(el('td','dt','= registro de '+brl(r.v)));
          tot.appendChild(el('td','r money',brl(Math.round(sm*100)/100)));
          dtb.appendChild(tot); dt2.appendChild(dtb); dr.appendChild(dt2);
          ctd.appendChild(dr); ctr.appendChild(ctd); body2.appendChild(ctr);
          var tg=function(){
            var op=ctr.hidden; ctr.hidden=!op;
            tr.classList.toggle('open',op); tr.setAttribute('aria-expanded',op?'true':'false');
          };
          tr.addEventListener('click',tg);
          tr.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tg();}});
        }
      });
      info.textContent=n+' registros · R$ '+brl(Math.round(soma*100)/100);
    }
    draw(false);
    viewEl.appendChild(c4);

    /* sem registro */
    if(d.semRegistro&&d.semRegistro.length){
      var c5=card();
      var tot=d.semRegistro.reduce(function(a,x){return a+x.v;},0);
      h2(c5,'Lançamentos sem registro no contas a pagar',
        d.semRegistro.length+' lançamento(s) somando R$ '+brl(Math.round(tot*100)/100)+' — é a diferença da semana.');
      var tw3=el('div','tw'),tb3=el('table');tb3.style.minWidth='520px';
      var th3=el('thead'),h3r=el('tr');
      ['Data','Descrição','Valor','Natureza'].forEach(function(h,i){h3r.appendChild(el('th',i===2?'r':null,h));});
      th3.appendChild(h3r);tb3.appendChild(th3);
      var tbd3=el('tbody');
      d.semRegistro.forEach(function(x){
        var tr=el('tr','rowcrit');
        tr.appendChild(el('td','dt',x.dt));
        tr.appendChild(el('td',null,x.d));
        tr.appendChild(el('td','r money',brl(x.v)));
        tr.appendChild(el('td',null,x.nat||'Tarifa'));
        tbd3.appendChild(tr);
      });
      tb3.appendChild(tbd3);
      var tf3=el('tfoot'),f3=el('tr');
      f3.style.cssText='background:var(--crit-soft);color:var(--crit)';
      f3.appendChild(el('td',null,'Total'));f3.appendChild(el('td',null,'Diferença da semana'));
      f3.appendChild(el('td','r money',brl(Math.round(tot*100)/100)));f3.appendChild(el('td'));
      tf3.appendChild(f3);tb3.appendChild(tf3);
      tw3.appendChild(tb3);c5.appendChild(tw3);
      viewEl.appendChild(c5);
    }

    /* anexos */
    (d.anexos||[]).forEach(function(a){
      var c=card(); h2(c,a.titulo,a.sub);
      var tw4=el('div','tw'),tb4=el('table');tb4.style.minWidth='860px';
      var th4=el('thead'),h4=el('tr');
      a.cols.forEach(function(x,i){h4.appendChild(el('th',(a.aligns&&a.aligns[i]==='r')?'r':null,x));});
      th4.appendChild(h4);tb4.appendChild(th4);
      var tbd4=el('tbody');
      a.rows.forEach(function(row){
        var tr=el('tr');
        row.forEach(function(cell,i){
          if(i===row.length-1&&String(cell).indexOf(':')>0){
            var parts=String(cell).split(':');
            if(parts[0]==='crit') tr.className='rowcrit';
            var td=el('td'); td.appendChild(el('span','tag t-'+parts[0],parts[1])); tr.appendChild(td);
          } else {
            tr.appendChild(el('td',(a.aligns&&a.aligns[i]==='r')?'r money':null,cell));
          }
        });
        tbd4.appendChild(tr);
      });
      tb4.appendChild(tbd4);
      if(a.foot){
        var tf4=el('tfoot'),f4=el('tr');
        a.foot.forEach(function(cell,i){f4.appendChild(el('td',(a.aligns&&a.aligns[i]==='r')?'r money':null,cell));});
        tf4.appendChild(f4);tb4.appendChild(tf4);
      }
      tw4.appendChild(tb4);c.appendChild(tw4);
      viewEl.appendChild(c);
    });

    /* divergências */
    var foco=pendsDe(d), proc=processoDe(d), resolv=(d.divergencias||[]).filter(function(x){return x.tier!=='crit'&&x.tier!=='warn';});
    if(foco.length){
      var c6=card();
      h2(c6,'Pagamentos a corrigir',foco.length+' itens que não conciliaram, não bateram ou pedem confirmação.');
      divsBlock(c6,foco); viewEl.appendChild(c6);
    }
    if(proc.length){
      var c6b=card();
      h2(c6b,'Melhorias de cadastro e rotina',proc.length+' ajustes que reduzem o trabalho manual das próximas conciliações.');
      divsBlock(c6b,proc); viewEl.appendChild(c6b);
    }
    if(resolv.length){
      var c6c=card();
      h2(c6c,'Confirmado e resolvido',resolv.length+' pontos esclarecidos ou fechados.');
      divsBlock(c6c,resolv); viewEl.appendChild(c6c);
    }

    /* histórico da conta */
    var c7=card();
    var serie=DOCS.filter(function(x){return x.conta===conta;});
    h2(c7,'Histórico da conta',serie.length+(serie.length===1?' fechamento gravado.':' fechamentos gravados.'));
    var tw5=el('div','tw'),tb5=el('table');tb5.style.minWidth='760px';
    var th5=el('thead'),h5=el('tr');
    ['Período','Registros','Contas a pagar','Recebido','Saldo final','Diferença','Pendências','Status']
      .forEach(function(h,i){h5.appendChild(el('th',(i>=1&&i<=6)?'r':null,h));});
    th5.appendChild(h5);tb5.appendChild(th5);
    var tbd5=el('tbody');
    serie.forEach(function(x){
      var tr=el('tr');
      if(x.periodoLabel===periodo) tr.style.background='var(--accent-soft)';
      tr.appendChild(el('td','dt',x.periodoLabel));
      tr.appendChild(el('td','r money',(x.conciliados||0)+'/'+(x.registros||0)));
      tr.appendChild(el('td','r money',brl(x.totalCP)));
      tr.appendChild(el('td','r money',brl(x.creditos)));
      var sf=el('td','r money',brl(x.saldoFinal));
      if(x.saldoFinal!=null&&x.saldoFinal<20000) sf.style.color='var(--crit)';
      tr.appendChild(sf);
      var df=el('td','r money',brl(x.diferenca||x.tarifasTotal||0));
      if(x.diferenca||x.tarifasTotal) df.style.color='var(--warn)';
      tr.appendChild(df);
      tr.appendChild(el('td','r money',String(pendsDe(x).filter(function(p){return !feito(x,p);}).length)));
      var st=el('td');
      var ok=x.conciliados===x.registros;
      st.appendChild(el('span','tag '+(ok?'t-ok':'t-warn'),ok?'Fechado':'Em aberto'));
      tr.appendChild(st);
      tbd5.appendChild(tr);
    });
    tb5.appendChild(tbd5);tw5.appendChild(tb5);c7.appendChild(tw5);
    if(serie.length>1)
      barsBlock(c7,serie.slice().reverse().map(function(x){return [x.periodoLabel,x.totalCP||0];}),meta.cor,null);
    viewEl.appendChild(c7);

    /* whatsapp */
    if(d.wpp){
      var c8=card();
      h2(c8,'Resumo para WhatsApp','Texto pronto para mandar no grupo ou para o Rapha.');
      var box=el('div','wppbox');
      var btn=el('button','btn copybtn','Copiar'); btn.type='button';
      var pre=el('pre',null,d.wpp);
      btn.addEventListener('click',function(){
        var done=function(){btn.textContent='Copiado';setTimeout(function(){btn.textContent='Copiar';},1800);};
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(pre.innerText).then(done).catch(function(){btn.textContent='Selecione e copie';});
        else{
          var r=document.createRange();r.selectNodeContents(pre);
          var s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selecionado';
        }
      });
      box.appendChild(btn);box.appendChild(pre);c8.appendChild(box);
      viewEl.appendChild(c8);
    }
  }

  function renderTabs(){
    tabsEl.innerHTML='';
    var t0=el('button','tab'+(conta==='holding'?' on':''),'Holding'); t0.type='button';
    t0.addEventListener('click',function(){conta='holding';render();});
    tabsEl.appendChild(t0);
    contas().forEach(function(c){
      var b=el('button','tab'+(conta===c.k?' on':'')); b.type='button';
      var d=el('span','bul'); d.style.background=c.cor; d.style.opacity='1';
      b.appendChild(d); b.appendChild(document.createTextNode(c.lbl));
      b.addEventListener('click',function(){conta=c.k;render();});
      tabsEl.appendChild(b);
    });
    perEl.innerHTML=''; perEl.appendChild(el('span','plabel','Período'));
    periodos().forEach(function(p){
      var b=el('button','per'+(periodo===p.lbl?' on':''),p.lbl); b.type='button';
      b.addEventListener('click',function(){periodo=p.lbl;render();});
      perEl.appendChild(b);
    });
  }

  function render(){
    fecharModal();
    renderTabs();
    if(conta==='holding') renderHolding(); else renderConta();
  }

  function bootEmpty(){
    tabsEl.innerHTML=''; 
    var t=el('button','tab on','Holding'); t.type='button'; tabsEl.appendChild(t);
    var c=card();
    h2(c,'Conciliação bancária semanal do Grupo Ragga');
    var e=el('div','empty');
    e.appendChild(el('b',null,'Nenhum fechamento gravado ainda'));
    e.appendChild(document.createTextNode('Cada conta conciliada aparece como uma aba aqui, com os períodos salvos lado a lado.'));
    c.appendChild(e); viewEl.appendChild(c);
  }
  bootEmpty();

  DOCS = (typeof SEED !== 'undefined' ? SEED : []).slice().sort(function(a,b){
    return (b.ordem||0)-(a.ordem||0) || String(a.conta).localeCompare(String(b.conta));
  });
  if(DOCS.length){
    statusEl.className='pill live';
    statusEl.textContent=DOCS.length+' fechamentos salvos';
    periodo=periodos()[0].lbl;
    render();
  }
})();
</script>

</body>
</html>
