,"3,6%","ok:Intercompany"],["Despesas gerais","1","590,00","0,3%","ok:Sócio"],["Cartão PF","1","414,28","0,2%","ok:Reembolso"],["Certificado","1","200,00","0,1%","ok:Operacional"],["Reembolso","1","100,00","0,1%","ok:Intercompany"]],"foot":["Total registrado","64","183.026,39","100,0%",""]},{"titulo":"Entradas — de onde veio o caixa","sub":"As 17 lojas mantiveram o padrão. Os dois créditos que fogem do padrão são o da Luvio e o reembolso da Rejaine.","cols":["Pagador","Créditos","Valor"],"aligns":["","r","r"],"rows":[["Big Fome Lanches","2","13.563,66"],["Sica Foods","5","9.508,44"],["Fusi Foods","6","8.758,44"],["Chema Foods","5","8.719,44"],["Agape Foods","5","7.478,16"],["Luvio Consultoria (Luiz Otávio)","1","7.167,00"],["Marti Foods","5","6.836,34"],["Rama Foods","6","6.629,94"],["Elma Foods","5","6.123,72"],["Demaqui Foods","5","4.815,06"],["Lana Foods","5","4.063,32"],["Pigui Foods","5","3.773,10"],["Veri Foods","6","3.268,56"],["Madri Foods","5","2.978,70"],["Panti Foods","5","2.817,12"],["Bruti Foods","6","2.595,01"],["Japi Foods","5","2.481,48"],["Rejaine Queli (reembolso)","1","2.336,89"],["Luama Foods","5","1.714,74"],["Nemaom Foods","5","1.110,78"]],"foot":["Total recebido","93","106.739,90"]}],"divergencias":[{"tier":"crit","foco":true,"titulo":"A conta fechou a janela com R$ 4.438,29","tag":"Caixa","paras":["Saíram R$ 183.205,39 e entraram R$ 106.739,90. A diferença, R$ 76.465,49, veio do saldo: a conta abriu em R$ 80.903,78 e fechou em R$ 4.438,29 no dia 16/10. É uma queda de 94,5% e o menor saldo que a MARLAY registra desde que esta rotina começou.","O gasto não foi disperso: 13, 14 e 15/10 concentram R$ 127.405,99 — 69,5% de tudo que saiu na janela. No dia 13 sozinho foram R$ 74.961,67 em 25 lançamentos, e o saldo passou de R$ 93.071,23 para R$ 31.200,04.","Duas semanas antes, no fechamento de 28/09–02/10, esta era a única conta do grupo gerando caixa (+R$ 19.821,68). A inversão foi completa em uma janela."],"acao":"Levar à diretoria o calendário de desembolso das próximas duas semanas contra o repasse previsto das lojas. Com R$ 4.438,29 em conta e R$ 25.000,00 de segunda parcela de franquia a vencer, qualquer boleto relevante depende de entrada nova.","valor":76465.49},{"tier":"crit","foco":true,"titulo":"Duas adesões de franquia na mesma janela, com R$ 25.000,00 ainda a vencer","tag":"Compromisso futuro","paras":["Royal Parma: R$ 20.000,00 pagos em 15/10 à Lima Cursos, parcela 1 de 2. Dell'Iris: R$ 5.000,00 pagos em 16/10 à Sardo Academy pelo direito de uso da marca em Cambé, parcela 1 de 2. Juntas, R$ 25.000,00 saíram e outros R$ 25.000,00 estão contratados.","Os dois pagamentos estão registrados e conciliados — não há nada de errado na execução. O ponto é o momento: as duas parcelas finais vão vencer sobre uma conta que fechou em R$ 4.438,29.","O registro da Royal Parma pede, em texto, confirmação na véspera do pagamento para envio do boleto e assinatura de contrato. Vale conferir se o contrato foi de fato assinado antes do PIX de R$ 20.000,00."],"acao":"Confirmar a data das segundas parcelas e provisionar. Conferir se os contratos das duas franquias estão assinados e arquivados.","valor":25000.0},{"tier":"warn","foco":true,"titulo":"R$ 179,00 saíram do banco sem registro no contas a pagar","tag":"Ajustar registro","paras":["Integralização de capital subscrito, R$ 100,00, debitada pelo Sicredi em 13/10, e cesta de relacionamento, R$ 79,00, em 15/10. Nenhuma das duas aparece na lista.","A cesta é o quarto fechamento seguido em que tarifa bancária sai sem contrapartida — na AVI o acumulado já passou de R$ 250,00. A integralização chama mais atenção porque há um registro quase idêntico na lista, de R$ 100,00 em 09/10, que se refere à conta da Cheton; este de 13/10 é outro, na própria conta da MARLAY.","Nenhum dos dois é erro de autorização. São lançamentos que o banco gera e que ninguém cadastra, e por isso aparecem aqui como se fossem saída não autorizada."],"acao":"Criar centro de custo para tarifa bancária e lançar a cesta todo mês. Registrar a integralização de capital de 13/10.","valor":179.0},{"tier":"warn","foco":true,"titulo":"Três pagamentos a nomes que não estão no cadastro","tag":"Cadastrar recebedor","paras":["Sunset Mall, frete das pedras, R$ 2.500,00 em 06/10 — saiu para DAVID PEREIRA LUSTRE, CPF. O registro traz só um número de telefone.","Reforma de 24 sofás dos Galileus, R$ 4.000,00 em 13/10 — registrado como Tapeçaria Monte Carlo, pago a VALDRIANA POLPETA, CPF.","Noé, alarme, R$ 200,00 em 13/10 — pago a A. MOZZAQUATRO COMÉRCIO DE FERRAMENTAS, que nas semanas anteriores aparece locando equipamento de obra, não prestando serviço de alarme. Valor e data batem e não há outro lançamento de R$ 200,00 no dia, então a amarração é segura; o que não bate é a natureza."],"acao":"Cadastrar o CPF ou CNPJ de quem recebe nos três casos, e conferir se o registro do alarme do Noé está com o fornecedor certo.","valor":6700.0},{"tier":"ok","foco":false,"titulo":"Salário da funcionária da casa sai e volta no mesmo dia","tag":"Conferido","paras":["Em 05/10 saíram R$ 2.336,89 para Valdirene Borges, registrados como salário de funcionária da casa, centro de custo Sócio. No mesmo dia entraram R$ 2.336,89 vindos de Rejaine Queli — valor idêntico, mesma data.","Na prática o pagamento é adiantado pela MARLAY e reembolsado imediatamente, então não consome caixa. Registro porque, olhando só a saída, parece despesa de sócio de R$ 2.336,89 por mês, e olhando as duas pernas o efeito é zero."],"acao":"Nenhuma para a conciliação. Vale amarrar as duas pernas no registro para que o custo não apareça inflado no centro de custo Sócio."},{"tier":"warn","foco":false,"titulo":"Crédito de R$ 7.167,00 da Luvio em 07/10","tag":"Explicar","paras":["Entraram R$ 7.167,00 por PIX da LUVIO CONSULTORIA, CNPJ 67.052.929/0001-35 — a PJ do Luiz Otávio, vínculo que você confirmou em setembro. É o único crédito da janela que não vem de loja nem de reembolso identificado.","No fechamento anterior o fluxo era o inverso: a MARLAY pagava R$ 1.119,97 de parcelamento de IR para a mesma PJ. Agora a PJ transfere para a MARLAY."],"acao":"Confirmar a que título esse valor entrou — devolução, aporte, acerto de conta — e registrar como receita ou como ajuste entre contas."},{"tier":"warn","foco":false,"titulo":"Despesas de sócio e investimento imobiliário somam R$ 56.044,25","tag":"Leitura","paras":["Investimento imobiliário levou R$ 37.262,15 em 12 registros — Sunset Dream em três lotes mais as duas taxas condominiais, Terras do Paraná, Terras de Canaã, Sun Lake, Avos Villa Noah e os IPTUs. Despesa de sócio levou R$ 18.782,10, incluindo aluguel, condomínio, faculdade, plano de saúde, pró-labore, o salário da funcionária da casa e a fechadura digital instalada a pedido da Diretoria.","Juntos são 30,6% do que saiu da conta na janela, em dinheiro que não volta para a operação. É a mesma conta que fechou com R$ 4.438,29."],"acao":"Nenhuma na conciliação. Registro para a leitura da diretoria, porque a conta que banca a expansão é a mesma que banca o investimento pessoal."},{"tier":"ok","foco":false,"titulo":"Notas antigas e de-paras já conhecidos","tag":"Rastreado","paras":["O material do Biggs 13, R$ 1.475,00, foi pago em 13/10 com nota fiscal emitida em 23/05 — quase cinco meses. Vale conferir se há mais notas represadas.","Os de-paras recorrentes vieram todos: Superar Refrigerações recebendo como Alison Aparecido (duas vezes), Rofer cedendo o boleto à Athos Fomento, Grupo Londrino pagando como Gamel, Alexandre Martins recebendo como Mais Doce por Amor via SumUp, Mult-Solution como Multi Kent, Royal Parma como Lima Cursos e Dell'Iris como Sardo Academy. Em todos o CNPJ do registro confirma a amarração.","Terras do Paraná aparece como um registro de R$ 6.476,68 e dois boletos de R$ 3.238,34 — os apartamentos 609 e 819 do Tayaya."],"acao":"Nenhuma. Padronizar esses nomes no cadastro reduz o trabalho de todo fechamento."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo em 02/10 no extrato, R$ 80.903,78, é idêntico ao saldo final apurado no fechamento de 28/09–02/10.","Dentro de 03 a 18/10: R$ 80.903,78 mais R$ 106.739,90 de entradas menos R$ 183.205,39 de saídas dá exatamente os R$ 4.438,29 que o extrato marca em 16/10. Todos os 64 registros da janela foram localizados; nenhum pagamento ficou sem explicação."],"acao":"Nenhuma."}],"pendencias":4,"pendenciasAbertas":["Levar o calendário de desembolso à diretoria — a conta fechou em R$ 4.438,29","Provisionar as segundas parcelas de Royal Parma e Dell'Iris (R$ 25.000,00) e conferir os contratos","Registrar a cesta de relacionamento e a integralização de capital (R$ 179,00)","Cadastrar os recebedores do frete, da tapeçaria e do alarme do Noé"],"composicaoDif":[{"tipo":"sem-registro","dt":"13/10","desc":"Integralização de capital subscrito — débito do Sicredi","v":100.0},{"tipo":"sem-registro","dt":"15/10","desc":"Cesta de relacionamento — tarifa do Sicredi","v":79.0}],"wpp":"*CONCILIAÇÃO SEMANAL — MARLAY (ML Consultoria)*\nPeríodo: 03 a 18/10/2026 · Conta Sicredi 66328-3\n\n*Resultado:* 64 de 64 registros conciliados. Continuidade exata com o fechamento anterior.\n\n• Contas a pagar registrado: R$ 183.026,39\n• Débitos no banco: R$ 183.205,39\n• Diferença: R$ 179,00 — dois débitos do banco sem registro\n• Saldo: R$ 80.903,78 -> *R$ 4.438,29*\n\n*ALERTA DE CAIXA*\nA conta queimou R$ 76.465,49 na janela e fechou com R$ 4.438,29 — queda de 94,5% e o menor saldo da série. Nos dias 13, 14 e 15/10 saíram R$ 127.405,99 — 69,5% da janela; só no dia 13 foram R$ 74.961,67 em 25 lançamentos.\nDuas semanas antes esta era a única conta do grupo gerando caixa.\n\n*Pontos para tratar:*\n1. *Duas adesões de franquia na mesma janela:* Royal Parma R$ 20.000,00 (1/2) e Dell'Iris R$ 5.000,00 (1/2). Mais R$ 25.000,00 de segunda parcela a vencer sobre uma conta com R$ 4.438,29. Conferir se os contratos estão assinados\n2. *R$ 179,00 saíram sem registro:* cesta de relacionamento R$ 79,00 e integralização de capital R$ 100,00. É o 4º fechamento seguido com tarifa bancária sem centro de custo\n3. *Três pagamentos a nomes fora do cadastro:* frete do Sunset Mall (R$ 2.500,00), reforma dos sofás (R$ 4.000,00) e alarme do Noé (R$ 200,00, pago a uma loja de ferramentas)\n4. *Entrou R$ 7.167,00 da Luvio (Luiz Otávio)* em 07/10 — precisa de classificação\n\n*Leitura:* investimento imobiliário e despesa de sócio somaram R$ 56.044,25 — 30,6% do que saiu — na mesma conta que banca a expansão e que fechou a janela praticamente zerada."},{"id":"mkt-2026-10-03","ordem":20261003,"conta":"mkt","contaLabel":"MKT & VENDAS","contaDetalhe":"Ragga MKT & Vendas · conta 520213530","cor":"#E86820","razaoSocial":"Ragga MKT & Vendas","periodoLabel":"03/10–18/10/2026","periodoInicio":"2026-10-03","periodoFim":"2026-10-18","emitido":"2026-10-23","semana":"41 e 42","chamada":"18 de 18 registros conciliados, diferença zero, e continuidade exata com o fechamento de 28/09–02/10. A conta financiou o grupo na janela: emprestou R$ 50.000,00 à AVI em 07/10 e recebeu de volta em 14/10. Pessoal responde por 44,0% do desembolso.","saldoAnterior":174318.55,"debitos":143742.22,"creditos":166359.56,"saldoFinal":196935.89,"saldoInformado":196935.89,"totalCP":143742.22,"debitoLiquido":143742.22,"diferenca":0.0,"registros":18,"conciliados":18,"lancamentos":115,"tarifasTotal":0,"creditosLojas":116359.56,"kpis":[{"k":"Conciliado","v":"18 / 18","d":"100% dos registros localizados no extrato","tone":"hero"},{"k":"Diferença","v":"0,00","d":"Todo valor pago bate com o registrado"},{"k":"Resultado da janela","v":"+22.617,34","d":"Entradas superaram as saídas","tone":"pos"},{"k":"Saldo em 16/10","v":"196.935,89","d":"continuidade exata · +13,0%","tone":"pos"}],"leitura":[{"txt":"Conciliados 1:1 com o extrato","nota":"Mesmo valor e mesma data de pagamento","n":"18","valor":143742.22,"tag":"Conciliado","tone":"ok"},{"txt":"Lançamentos no banco sem registro","nota":"Nenhum eracional"],["Bonificação","1","3.000,00","2,1%","ok:Pessoal"],["Rádio","1","1.000,00","0,7%","ok:Mídia"],["Comunicação","2","480,00","0,3%","ok:Operacional"]],"foot":["Total pago","18","143.742,22","100,0%",""]},{"titulo":"Entradas — de onde veio o caixa","cols":["Pagador","Créditos","Valor"],"aligns":["","r","r"],"sub":"Os repasses vieram em quatro ondas: 07, 08 e 09/10 com R$ 9.817,88 cada, e 14/10 concentrando R$ 136.330,24 em 45 créditos.","rows":[["AVI Distribuidora (devolução)","1","50.000,00"],["Sica Foods","6","14.948,72"],["Chema Foods","6","13.380,81"],["Agape Foods","6","11.700,14"],["Marti Foods","7","10.042,77"],["Elma Foods","6","9.514,67"],["Demaqui Foods","5","7.031,93"],["Lana Foods","6","6.563,49"],["Fusi Foods","5","5.870,81"],["Pigui Foods","6","5.779,63"],["Veri Foods","6","5.251,09"],["Rama Foods","4","4.910,72"],["Madri Foods","5","4.449,88"],["Panti Foods","6","4.432,78"],["Bruti Foods","6","4.135,61"],["Japi Foods","5","3.910,13"],["Luama Foods","5","2.789,78"],["Nemaom Foods","6","1.646,60"]],"foot":["Total recebido","97","166.359,56"]}],"divergencias":[{"tier":"warn","foco":true,"titulo":"Reembolso de cartão PF de R$ 20.925,52 descrito só como \"EBN *Adobe\"","tag":"Anexar documento","paras":["Em 13/10 saíram R$ 20.925,52 por PIX para Amanda Galvão Antunes Pereira, registrados como reembolso de cartão pessoa física, com a descrição \"EBN *Adobe\". É o segundo maior pagamento da janela, atrás apenas do empréstimo à AVI que voltou.","O pagamento está conciliado: valor e data batem com o registro. O que falta é o documento. Reembolso de cartão PF em cinco dígitos sustentado por um nome de estabelecimento é exatamente o tipo de lançamento que, numa auditoria ou numa pergunta da diretoria, não se defende sozinho — e isso vale igual para qualquer nome que estivesse ali, inclusive o seu.","No fechamento de 14–18/09 esta mesma conta teve um reembolso de cartão com estorno no mesmo dia (R$ 11.190,70 menos R$ 4.921,32). Com dois casos na série, vale fixar a regra."],"acao":"Anexar a fatura do cartão com os itens que compõem os R$ 20.925,52 ao registro no contas a pagar. Se for assinatura de software, vale avaliar passar a cobrança para um cartão corporativo e sair do reembolso.","valor":20925.52},{"tier":"warn","foco":true,"titulo":"Prestadores pagos a PJ sem o CNPJ no cadastro","tag":"Cadastro","paras":["Rodolfo Augusto de Souza Pontes recebeu duas vezes em 09/10 — R$ 5.000,00 de pró-labore e R$ 3.000,00 de bonificação — e nas duas o dinheiro saiu para PONTES CONSULTORIA PARA RESTAURANTES. Carolina de Cassia Bispo Matsumoto recebeu R$ 8.000,00 e o PIX saiu para CBM CONSULTORIA EM COMUNICAÇÃO.","Nos dois casos o cadastro traz a pessoa física e o banco mostra a PJ. O vínculo da CBM você já confirmou em setembro; o da Pontes aparece aqui pela primeira vez, e o CNPJ 63.140.823/0001-32 está escrito na descrição do registro da bonificação, mas não no cadastro do fornecedor.","Enquanto a PJ não estiver no cadastro, todo mês esses pagamentos vão abrir divergência de nome e consumir tempo da conciliação."],"acao":"Incluir no cadastro de cada prestador a razão social e o CNPJ que efetivamente recebem. Vale conferir também se os contratos estão no nome das PJ.","valor":16000.0},{"tier":"warn","foco":true,"titulo":"Gráfica Nova Supri recebe como Daniele Alexandre Cordeiro","tag":"Cadastrar recebedor","paras":["R$ 230,00 registrados para GRÁFICA NOVA SUPRI saíram em 13/10 para DANIELE ALEXANDRE CORDEIRO GRÁFICA E PAPELARIA. Valor pequeno, mas é um nome que não está em lugar nenhum do cadastro.","Como a outra gráfica da janela (Digital P Color) bate exatamente, dá para isolar que o problema é só no cadastro da Nova Supri."],"acao":"Registrar a razão social e o CNPJ que recebem pela Gráfica Nova Supri.","valor":230.0},{"tier":"ok","foco":false,"titulo":"Empréstimo de R$ 50.000,00 à AVI saiu e voltou dentro da janela","tag":"Intercompany fechado","paras":["Em 07/10 a MKT & Vendas transferiu R$ 50.000,00 para a AVI Distribuidora, registrado como ajuste entre contas — \"empréstimo para compor saldo da semana\". Em 14/10 o mesmo valor voltou, por PIX da AVI. Sete dias, ida e volta, valor idêntico.","Isso conversa com o que a conciliação vinha apontando: a AVI fechou 02/10 com R$ 7.901,94 e já havia zerado o caixa em 18/09. O empréstimo é a resposta do grupo a esse aperto — e o fato de ter voltado na semana seguinte é o que distingue um socorro pontual de um financiamento permanente.","Marcado como intercompany nas duas pontas, para ser eliminado na consolidação."],"acao":"Nenhuma para a conciliação. Se o socorro à AVI se repetir, vale acompanhar como linha própria no fluxo de caixa, não como ajuste entre contas."},{"tier":"ok","foco":false,"titulo":"Pessoal é 44,0% do que saiu na janela","tag":"Leitura","paras":["Sete pró-labores PJ, um salário e uma bonificação somam R$ 63.313,66 — 44,0% do desembolso da janela. O pagamento de 09/10 sozinho levou R$ 52.813,66 em sete transferências.","Fora o empréstimo à AVI, que voltou, essa é a estrutura de custo da conta: equipe. Mídia e material gráfico somados dão R$ 1.480,00, e as despesas operacionais do dia 16/10, R$ 3.023,04."],"acao":"Nenhuma. Registro para a leitura da diretoria."},{"tier":"warn","foco":false,"titulo":"Lançamentos depois da janela que ainda não vi no contas a pagar","tag":"Próximo fechamento","paras":["Entre 19 e 22/10 o extrato traz: Setalab R$ 6.890,00 (esse está na lista, pago dois dias após o vencimento), Facebook Serviços Online R$ 1.500,00, CBM R$ 148,80, ML Consultoria R$ 35.000,00, Gamel R$ 18.401,34, CEF R$ 252,02 e Metrópole R$ 32,00.","Todos são posteriores a 18/10, então é esperado que não estejam nesta lista. Chamo atenção para os R$ 35.000,00 para a ML Consultoria em 20/10 — é intercompany e vai precisar de contrapartida na MARLAY."],"acao":"Nenhuma agora. Incluir todos no contas a pagar de 19 a 24/10."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo em 02/10 no extrato, R$ 174.318,55, é idêntico ao saldo final apurado no fechamento de 28/09–02/10. Nenhum movimento ficou entre as duas janelas.","Dentro de 03 a 18/10: R$ 174.318,55 mais R$ 166.359,56 de entradas menos R$ 143.742,22 de saídas dá exatamente os R$ 196.935,89 que o extrato marca em 16/10, último dia com movimento na janela."],"acao":"Nenhuma."}],"pendencias":3,"pendenciasAbertas":["Anexar a fatura que compõe o reembolso de cartão PF de R$ 20.925,52","Cadastrar as PJ de Rodolfo Pontes e Carolina Matsumoto, com CNPJ","Cadastrar a razão social que recebe pela Gráfica Nova Supri"],"composicaoDif":[],"wpp":"*CONCILIAÇÃO SEMANAL — RAGGA MKT & VENDAS*\nPeríodo: 03 a 18/10/2026 · Conta 520213530\n\n*Resultado:* 18 de 18 registros conciliados, *diferença zero*. Continuidade exata com o fechamento anterior e nenhum débito no extrato sem registro no contas a pagar.\n\n• Contas a pagar registrado: R$ 143.742,22\n• Débitos no banco: R$ 143.742,22\n• Entradas: R$ 166.359,56\n• Saldo: R$ 174.318,55 -> R$ 196.935,89 (+13,0%)\n\n*A CONTA FINANCIOU O GRUPO E FOI RESSARCIDA*\nEm 07/10 saíram R$ 50.000,00 de empréstimo para a AVI compor saldo da semana, e em 14/10 o valor voltou integral. Sete dias, ida e volta. A AVI vinha fechando as semanas sem caixa de folga, então o socorro era esperado — o que importa é que foi devolvido.\n\n*Pontos para tratar:*\n1. *Reembolso de cartão PF de R$ 20.925,52* (13/10) está descrito apenas como \"EBN *Adobe\". O pagamento concilia, mas falta a fatura anexada ao registro — é o segundo maior desembolso da janela\n2. *Rodolfo Pontes e Carolina Matsumoto* recebem por PJ (Pontes Consultoria e CBM Consultoria) e o cadastro traz a pessoa física — incluir razão social e CNPJ\n3. *Gráfica Nova Supri* recebe como Daniele Alexandre Cordeiro — cadastrar a recebedora\n4. Setalab R$ 6.890,00 venceu 17/10 e saiu 19/10; entra no próximo fechamento\n\n*Leitura:* pessoal respondeu por 44,0% do desembolso (R$ 63.313,66), com R$ 52.813,66 saindo num único dia, 09/10."},{"id":"reti-2026-10-03","ordem":20261003,"conta":"reti","contaLabel":"RETI","contaDetalhe":"Ragga Gestão · Sicredi 65737-0","cor":"#1E40AF","razaoSocial":"RETI Consultoria e Gestão de Restaurantes Ltda","periodoLabel":"03/10–18/10/2026","periodoInicio":"2026-10-03","periodoFim":"2026-10-18","emitido":"2026-10-23","semana":"41 e 42","chamada":"32 de 32 registros conciliados e continuidade exata. Em 13/10 o saldo fechou em R$ 160,71 — a segunda conta do grupo a raspar o caixa nesta janela. Pessoal e reembolso de cartão somaram R$ 81.402,46, 59,4% de tudo que saiu, e o aluguel da MEL fechou a ponta intercompany com a MKT & Vendas.","saldoAnterior":22132.82,"debitos":137246.33,"creditos":151206.69,"saldoFinal":36093.18,"saldoInformado":36093.18,"totalCP":137067.33,"debitoLiquido":137246.33,"diferenca":179.0,"registros":32,"conciliados":32,"lancamentos":169,"tarifasTotal":79.0,"creditosLojas":146206.69,"kpis":[{"k":"Conciliado","v":"32 / 32","d":"100% dos registros localizados no extrato","tone":"hero"},{"k":"Diferença não registrada","v":"179,00","d":"capital subscrito e cesta · clique para ver","tone":"warn","drill":"dif"},{"k":"Menor saldo do dia","v":"160,71","d":"13/10 · o caixa raspou o fundo","tone":"crit"},{"k":"Saldo em 16/10","v":"36.093,18","d":"continuidade exata · +63,1%","tone":"pos"}],"leitura":[{"txt":"Conciliados 1:1 com o extrato","nota":"Mesmo valor e mesma data de pagamento","n":"31","valor":135856.38,"tag":"Conciliado","tone":"ok"},{"txt":"Registro aberto em vários boletos","nota":"Junta Comercial R$ 1.210,95 = 9 boletos de R$ 134,55, mais 1 registrado à parte — 10 CNPJ no total","n":"1","valor":1210.95,"tag":"Conciliado","tone":"ok"},{"txt":"Lançamentos no banco sem registro","nota":"Integralização de capital R$ 100,00 (13/10) e cesta de relacionamento R$ 79,00 (15/10)","n":"2","valor":179.0,"tag":"Sem contrapartida","tone":"crit"},{"txt":"Pagos a nome diferente do cadastro","nota":"Luvio (Luiz Otávio), Londrimuth (Muth), José A el do Pitol, consultoria do Instituto Paloma Torres, reembolso de cartão, pró-labore e honorários — e o saldo caiu de R$ 26.706,91 para R$ 160,71.","Antes disso, em 06/10, a conta já havia fechado o dia em R$ 4.714,12. Os repasses das lojas de 14/10 é que recompuseram o caixa.","É a segunda conta do grupo a raspar o fundo nesta mesma janela: a AVI fechou 08/10 com R$ 3,60. As duas sobreviveram porque o dinheiro entrou no dia seguinte, não porque havia reserva."],"acao":"Nesta e na AVI, a conciliação já mostrou o mesmo padrão em janelas seguidas. Vale levar à diretoria uma projeção simples de saldo diário das cinco contas, para que pagamentos grandes sejam programados para depois do repasse e não antes.","valor":160.71},{"tier":"warn","foco":true,"titulo":"R$ 28.484,65 de reembolso de cartão pessoa física em três registros","tag":"Anexar documento","paras":["Amanda Galvão recebeu R$ 10.000,00 em 08/10, descritos como \"adiantamento parcial do valor total do cartão a pedido da Larissa\", e R$ 10.968,92 em 13/10, descritos como \"celular MKT\". Luiz Otávio recebeu R$ 7.515,73 em 07/10.","O registro do Luiz Otávio traz os 21 itens que compõem o valor, com data e finalidade de cada um. É exatamente o padrão que falta nos outros dois: \"celular MKT\" não sustenta R$ 10.968,92, e um adiantamento pago antes do fechamento da fatura não tem como ser conferido contra nada.","Somando as três contas nesta janela, reembolso de cartão PF chegou a R$ 49.824,45 — R$ 28.484,65 aqui, R$ 20.925,52 na MKT & Vendas e R$ 414,28 na MARLAY. É a terceira maior linha de desembolso do grupo no período, atrás de CMV e de pessoal."],"acao":"Adotar o padrão do registro do Luiz Otávio para todos: fatura anexada e itens discriminados antes do reembolso. Para adiantamento, registrar o acerto quando a fatura fechar, para que o valor não fique em aberto no contas a pagar.","valor":28484.65},{"tier":"warn","foco":true,"titulo":"R$ 179,00 saíram do banco sem registro","tag":"Ajustar registro","paras":["Integralização de capital subscrito, R$ 100,00, em 13/10, e cesta de relacionamento, R$ 79,00, em 15/10.","São os mesmos dois lançamentos que apareceram na MARLAY e na AVI, nas mesmas datas. Nesta janela, somando as três contas, tarifa bancária e integralização de capital sem registro chegam a R$ 847,58.","Nenhum é erro de autorização, mas todos aparecem na conciliação exatamente como apareceria uma saída não autorizada."],"acao":"Criar um centro de custo de tarifa bancária e lançar os dois itens em todas as contas, de uma vez. Resolve o problema nas cinco de uma única vez.","valor":179.0},{"tier":"ok","foco":false,"titulo":"Aluguel do Pitol: R$ 5.000,00 voltaram da MEL no mesmo período","tag":"Intercompany fechado","paras":["A RETI pagou R$ 12.784,00 de aluguel ao Pitol Empreendimentos em 13/10. O registro diz que R$ 5.000,00 seriam reembolsados pela MEL, que faz a sublocação — e em 13/10 entraram exatamente R$ 5.000,00 por PIX da MEL SERVIÇOS ADMINISTRATIVOS.","Do outro lado, o contas a pagar da Ragga MKT & Vendas registra R$ 5.000,00 em 13/10 como reembolso de aluguel, com a descrição \"Pitol Empreendimentos — 5K MEL realiza o pagamento como sublocação — pagar para a RETI\". As duas pontas fecham no valor e na data.","Com isso, três evidências independentes apontam que a conta Ragga MKT & Vendas opera sob a razão social Mel Serviços Administrativos Ltda, CNPJ 57.015.457/0001-97: o empréstimo de R$ 50.000,00 à AVI, este reembolso e a própria descrição do registro. Falta só o cadastro dizer isso."],"acao":"Registrar o de-para entre Ragga MKT & Vendas e Mel Serviços Administrativos. O custo líquido do aluguel para a RETI é R$ 7.784,00, não R$ 12.784,00."},{"tier":"warn","foco":false,"titulo":"Dez CNPJ abertos para ajuste gerencial das folhas","tag":"Leitura","paras":["A Junta Comercial recebeu dez boletos de R$ 134,55 em 07/10, R$ 1.345,50 no total, registrados em duas linhas: uma de R$ 1.210,95 para nove CNPJ e outra de R$ 134,55 para o décimo. O próprio registro explica que é para ajuste gerencial das folhas das lojas do Ragga SAL Restaurantes.","Separadamente, a Aliança Tecnologia cobrou R$ 4.284,50 de adesão à plataforma conciliadora, calculada sobre 41 CNPJs, parcelada em duas vezes — outros R$ 4.284,50 estão a vencer.","Os dois números juntos dizem o tamanho da estrutura societária que a holding administra hoje, e o custo fixo que ela carrega."],"acao":"Nenhuma na conciliação. Provisionar a segunda parcela da Aliança e conferir se o décimo CNPJ ficou pendente, como o registro sugere."},{"tier":"ok","foco":false,"titulo":"Os repasses das lojas voltaram para esta conta","tag":"Normalizado","paras":["Na janela de 28/09 a 02/10 a RETI recebeu um único crédito, R$ 1.463,76, e fechou com R$ 22.132,82 depois de cair 84%. Nesta janela voltaram 126 transferências das 17 lojas, R$ 146.206,69.","As entradas cobriram 110,2% das saídas e o saldo subiu 63,1%. O aperto da janela anterior era de calendário de repasse, não de operação."],"acao":"Nenhuma."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo em 02/10 no extrato, R$ 22.132,82, é idêntico ao saldo final apurado no fechamento de 28/09–02/10.","Dentro de 03 a 18/10: R$ 22.132,82 mais R$ 151.206,69 de entradas menos R$ 137.246,33 de saídas dá exatamente os R$ 36.093,18 que o extrato marca em 16/10. Todos os 32 registros foram localizados."],"acao":"Nenhuma."}],"pendencias":3,"pendenciasAbertas":["Anexar as faturas dos reembolsos de cartão PF e acertar o adiantamento de R$ 10.000,00","Criar centro de custo de tarifa bancária — R$ 847,58 sem registro nas três contas desta janela","Levar à diretoria a projeção de saldo diário — RETI em R$ 160,71 e AVI em R$ 3,60 na mesma janela"],"composicaoDif":[{"tipo":"sem-registro","dt":"13/10","desc":"Integralização de capital subscrito — débito do Sicredi","v":100.0},{"tipo":"sem-registro","dt":"15/10","desc":"Cesta de relacionamento — tarifa do Sicredi","v":79.0}],"wpp":"*CONCILIAÇÃO SEMANAL — RETI (Ragga Gestão)*\nPeríodo: 03 a 18/10/2026 · Conta Sicredi 65737-0\n\n*Resultado:* 32 de 32 registros conciliados. Continuidade exata com o fechamento anterior.\n\n• Contas a pagar registrado: R$ 137.067,33\n• Débitos no banco: R$ 137.246,33\n• Diferença: R$ 179,00 — integralização de capital e cesta de relacionamento, sem registro\n• Saldo: R$ 22.132,82 -> R$ 36.093,18 (+63,1%)\n\n*ALERTA DE CAIXA*\nEm 13/10 a conta fechou o dia com *R$ 160,71*. Naquele dia saíram R$ 43.722,32 em sete lançamentos e o que recompôs o caixa foram os repasses das lojas no dia seguinte.\nÉ a segunda conta a raspar o fundo na mesma janela — a AVI fechou 08/10 com R$ 3,60.\n\n*Pontos para tratar:*\n1. *Reembolso de cartão PF de R$ 28.484,65* em três registros. O do Luiz Otávio (R$ 7.515,73) traz os 21 itens discriminados — é o padrão. Os outros dois são \"celular MKT\" (R$ 10.968,92) e um adiantamento de R$ 10.000,00 pago antes do fechamento da fatura. Somando as três contas, cartão PF chegou a R$ 49.824,45 na janela\n2. *R$ 179,00 sem registro* (capital subscrito e cesta). Nas três contas da janela isso soma R$ 847,58 — um centro de custo de tarifa resolve nas cinco de uma vez\n3. *Dez CNPJ abertos* para ajuste gerencial das folhas (R$ 1.345,50) e adesão à conciliadora calculada sobre 41 CNPJs (R$ 4.284,50, com a 2ª parcela a vencer)\n\n*Fechado:* os R$ 5.000,00 de sublocação voltaram da MEL em 13/10, amarrando a ponta com a MKT & Vendas. O custo líquido do aluguel foi R$ 7.784,00."},{"id":"social-2026-10-03","ordem":20261003,"conta":"social","contaLabel":"RAGGA SOCIAL","contaDetalhe":"Ragga Social · Nubank 990919024-0","cor":"#8A2040","razaoSocial":"GDX Manutenções e Serviços Ltda","periodoLabel":"03/10–18/10/2026","periodoInicio":"2026-10-03","periodoFim":"2026-10-18","emitido":"2026-10-23","semana":"41 e 42","chamada":"5 de 5 registros conciliados, diferença zero e continuidade exata com o fechamento de 28/09–02/10. O que pede atenção não está dentro da janela: em cols":["Loja","Entrou aqui em 22/10","MARLAY em 20–25/09","Diferença"],"aligns":["","r","r","r"],"rows":[["Sica Foods","8.838,42","8.838,40","0,02"],["Chema Foods","7.668,42","7.668,40","0,02"],["Agape Foods","6.875,55","6.875,65","-0,10"],["Elma Foods","5.541,95","5.541,95","0,00"],["Marti Foods","5.414,64","5.414,65","-0,01"],["Fusi Foods","4.908,37","4.908,30","0,07"],["Rama Foods","4.337,64","4.337,65","-0,01"],["Lana Foods","4.010,72","4.010,70","0,02"],["Demaqui Foods","3.758,27","3.758,25","0,02"],["Pigui Foods","3.304,20","3.304,20","0,00"],["Veri Foods","3.188,16","3.188,15","0,01"],["Panti Foods","2.623,74","2.623,75","-0,01"],["Bruti Foods","2.486,61","2.486,60","0,01"],["Madri Foods","2.457,99","2.458,00","-0,01"],["Japi Foods","2.318,38","2.318,40","-0,02"],["Luama Foods","1.719,17","1.719,15","0,02"],["Nemaom Foods","899,54","899,55","-0,01"]],"foot":["Total","70.351,77","70.351,75","0,02"]}],"divergencias":[{"tier":"crit","foco":true,"titulo":"As 17 lojas repassaram R$ 70.351,77 para esta conta em 22/10","tag":"Fora da janela · conferir","paras":["Em 22/10 — já fora do período conciliado — as 17 lojas Foods transferiram R$ 70.351,77 por PIX para esta conta. É o primeiro crédito de loja que aparece aqui em toda a série: nos três fechamentos anteriores a Ragga Social não recebeu nada das lojas.","Comparei loja por loja com os repasses que a MARLAY recebeu em 20–25/09 e são os mesmos valores. Sica R$ 8.838,42 contra R$ 8.838,40; Chema R$ 7.668,42 contra R$ 7.668,40; e assim por diante nas 17. Nenhuma diverge mais de dez centavos, e o total fecha em R$ 70.351,77 contra R$ 70.351,75. A diferença entre os dois conjuntos é de dois centavos no agregado.","Pode ser o repasse mensal recalculado sobre a mesma base, pode ser uma mudança de destinatário decidida pela diretoria, pode ser erro de cadastro na origem. O que o extrato mostra é que um valor idêntico ao que uma empresa do grupo recebeu há um mês entrou agora em outra, e isso não se explica sozinho."],"acao":"Confirmar com quem opera o repasse a que título essas 17 transferências foram feitas para esta conta e se o destinatário foi alterado de propósito. Se houver documento da decisão, vale anexar ao fechamento. Eu amarro isso no fechamento de 19 a 24/10.","valor":70351.77},{"tier":"warn","foco":true,"titulo":"A conta não está no nome de Ragga Social","tag":"Cadastro","paras":["O extrato é da GDX MANUTENÇÕES E SERVIÇOS LTDA, CNPJ 59.472.218/0001-91, conta Nubank 990919024-0. Tratamos essa conta como Ragga Social desde o primeiro fechamento porque é assim que ela aparece no contas a pagar.","Enquanto as duas denominações não estiverem amarradas no cadastro, qualquer pessoa que confira o extrato contra a planilha vai encontrar uma empresa que não existe na estrutura descrita — e as ofertas, ajudas de custo e treinamentos saem de um CNPJ de manutenção e serviços."],"acao":"Registrar no cadastro que Ragga Social corresponde à GDX Manutenções e Serviços Ltda, com o CNPJ, ou corrigir a denominação na planilha. Vale também alinhar com a contabilidade se a natureza dos pagamentos combina com o objeto social desse CNPJ.","valor":0},{"tier":"warn","foco":true,"titulo":"Dado de saúde de uma pessoa identificada no campo de descrição","tag":"LGPD","paras":["Um dos registros desta lista descreve, em campo livre, um procedimento médico de uma pessoa nomeada. Dado de saúde é dado pessoal sensível pelo artigo 11 da LGPD e exige base legal própria e acesso restrito — o contas a pagar é planilha de circulação ampla.","Não é a primeira vez que isso aparece na rotina. O pagamento em si está correto e conciliado; o problema é o que está escrito ao lado dele.","Mantive esse detalhe fora do painel de propósito: aqui o registro aparece apenas como ajuda de custo."],"acao":"Substituir a descrição por algo genérico, como \"ajuda de custo — parcela 2/2\", e guardar a justificativa detalhada em local de acesso restrito. Se for virar praxe, vale combinar com o financeiro o que pode e o que não pode ir para o campo de descrição.","valor":0},{"tier":"warn","foco":false,"titulo":"Dois pagamentos no extrato que não estão na lista enviada","tag":"Export incompleto","paras":["Depois da janela, o extrato traz Gamel Serviços Terceirizados R$ 3.074,46 em 20/10 e Metrópole Apoio Administrativo R$ 472,57 em 22/10. Nenhum dos dois está na lista de contas a pagar que recebi.","Os dois são posteriores a 18/10, então é esperado que não estejam nesta lista. Registro porque nos fechamentos anteriores já aconteceu de um pagamento legítimo ficar de fora do recorte exportado, e um registro faltando é visualmente idêntico a um pagamento não autorizado."],"acao":"Nenhuma agora. Incluir os dois no contas a pagar do próximo fechamento, de 19 a 24/10.","valor":3547.03},{"tier":"ok","foco":false,"titulo":"De-para dos três nomes que não batem","tag":"Rastreado","paras":["1º IPI é a Igreja Presbiteriana Independente de Londrina, CNPJ 78.295.581/0001-23 — a sigla do cadastro não diz isso para quem olha de fora. Legacy Treinamento e Eventos recebe como New Legacy Brasil, e o CNPJ 53.023.196/0001-04 que a própria descrição do registro traz confirma. Luvio Consultoria é o Luiz Otávio, vínculo que você já confirmou em setembro.","Silas Dias Barbosa no cadastro, Silas Barbosa Dias no banco — ordem do nome invertida, mesma pessoa, mesmo CPF."],"acao":"Nenhuma para a conciliação. Padronizar os quatro nomes no cadastro economiza tempo todo fechamento."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo inicial do extrato, R$ 74.287,84, é idêntico ao saldo final que apuramos no fechamento de 28/09–02/10. Nenhum movimento ficou entre as duas janelas.","Dentro de 03 a 18/10: R$ 74.287,84 menos R$ 20.439,06 de saídas mais R$ 9,10 de rendimento dá exatamente os R$ 53.857,88 que o extrato marca como saldo do dia 16/10. A conta é remunerada e o rendimento aparece pingado dia a dia, por isso o saldo de cada dia fica alguns centavos acima da subtração simples."],"acao":"Nenhuma."}],"pendencias":3,"pendenciasAbertas":["Confirmar a que título as 17 lojas repassaram R$ 70.351,77 para esta conta em 22/10","Amarrar no cadastro que Ragga Social é a GDX Manutenções e Serviços Ltda, CNPJ 59.472.218/0001-91","Tirar o dado de saúde do campo de descrição do contas a pagar (LGPD)"],"composicaoDif":[],"wpp":"*CONCILIAÇÃO SEMANAL — RAGGA SOCIAL*\nPeríodo: 03 a 18/10/2026 · Nubank 990919024-0\n\n*Resultado:* 5 de 5 registros conciliados, *diferença zero*. Continuidade exata com o fechamento anterior e nenhum débito no extrato sem registro no contas a pagar.\n\n• Contas a pagar registrado: R$ 20.439,06\n• Débitos no banco: R$ 20.439,06\n• Saldo: R$ 74.287,84 -> R$ 53.857,88 (rendimento de R$ 9,10 no período)\n\n*PONTO QUE PRECISA DE RESPOSTA*\nEm 22/10, já fora da janela, as 17 lojas repassaram *R$ 70.351,77* para esta conta — o primeiro crédito de loja que aparece aqui em toda a série. Conferi loja por loja: são os mesmos valores que a MARLAY recebeu em 20 a 25/09 (R$ 70.351,75), nenhuma diferindo mais de dez centavos.\nPrecisa confirmar a que título esse repasse veio para cá e se o destinatário foi alterado de propósito.\n\n*Outros pontos:*\n1. A conta é da *GDX Manutenções e Serviços Ltda* (CNPJ 59.472.218/0001-91), não de uma empresa chamada Ragga Social — amarrar as duas denominações no cadastro\n2. Um registro traz dado de saúde de pessoa identificada no campo de descrição. É dado sensível pela LGPD e o contas a pagar circula aberto — trocar por descrição genérica\n3. Gamel R$ 3.074,46 (20/10) e Metrópole R$ 472,57 (22/10) estão no extrato e não na lista; são posteriores a 18/10 e entram no próximo fechamento\n4. O pagamento de R$ 1.550,02 saiu em 19/10, um dia depois da janela — conciliado no próximo período","saldoObs":"conta remunerada — o rendimento de R$ 9,10 entra pingado dia a dia, por isso o saldo de cada dia fica alguns centavos acima da subtração simples. O saldo final é o de 16/10, último dia com movimento dentro da janela."},{"alerta":{"acao":"Avaliar prazo médio de compra contra o ciclo de recebimento das lojas. Com CMV a 91% do desembolso e fornecedores de prazo curto, qualquer atraso no repasse joga a conta para o negativo.","paras":["A AVI entrou com R$ 68.228,33, recebeu R$ 118.388,83 e pagou R$ 178.715,22. As entradas cobriram 66% das saídas e o saldo terminou abaixo de R$ 8 mil.","É a segunda vez em três semanas: na semana 38 fechou em R$ 7,89, na 39 recuperou para R$ 68.228,33 e agora voltou a esvaziar. O padrão sugere que a conta opera no limite, dependendo do repasse das lojas chegar antes do vencimento dos boletos.","Um dado reforça: a maior compra da semana, R$ 21.091,14 do Frigorífico Astra, tem no próprio registro a observação de que o prazo de pagamento é de apenas 7 dias."],"tag":"Liquidez","titulo":"A conta fechou a semana em R$ 7.901,94"},"amarracao":[[{"lbl":"Saldo anterior","sub":"= saldo final do fechamento de 20–25/09","val":68228.33},{"lbl":"(+) Créditos do período","sub":"57 PIX de 18 pagadores + 2 liquidações de cobrança","tone":"pos","val":118388.83},{"lbl":"(−) Débitos do período","sub":"88 lançamentos","tone":"neg","val":178715.22},{"lbl":"= Saldo em 02/10/2026","sub":"fecha a janela conciliada do período","tipo":"tot","val":7901.94}],[{"lbl":"Débitos no banco","val":178715.22},{"lbl":"(−) Tarifas bancárias","sub":"6 lançamentos, nenhum registrado","tone":"neg","val":50.18},{"lbl":"(+) Água paga abaixo do registrado","sub":"Sanepar — R$ 180,69 contra R$ 182,33","tone":"pos","val":1.64},{"lbl":"= Débitos ao valor registrado","val":178666.68},{"lbl":"(−) Total registrado em contas a pagar","val":178666.68},{"lbl":"= Diferença","tipo":"key","val":0}]],"anexos":[{"aligns":["","r","r","r",""],"cols":["Centro de custo","Registros","Valor","% da semana","Natureza"],"foot":["Total","82","178.666,68","100%",""],"rows":[["CMV","65","162.637,85","91,0%","ok:Mercadoria"],["Vale refeição","1","6.983,61","3,9%","ok:Benefício"],["Aluguel","1","3 rcompany nos dois lados, para ser eliminado na consolidação do grupo.","foco":false,"paras":["O crédito estava dentro da liquidação de R$ 503,48 de 22/09. O borderô da carteira de cobrança mostra dois títulos liquidados em 21/09: R$ 199,88 da RETI, referente ao EPI, e R$ 303,60 da Ludo Alimentos. Somados, dão exatamente os R$ 503,48.","Aprendizado para a rotina: o Sicredi agrupa as liquidações de boleto do dia numa única linha de LIQ.COBRANCA SIMPLES. Recebimento por boleto não aparece título a título no extrato — para conferir um valor específico é preciso abrir o borderô."],"tag":"Resolvido","tier":"ok","titulo":"EPI vendido à RETI — crédito localizado"},{"acao":"Criar o centro de custo de tarifas bancárias e lançar semanalmente. A recomendação já vale para RETI, AVI e MARLAY.","foco":true,"paras":["Oito lançamentos na semana — manutenção de títulos, baixa de títulos e tarifa com registro de liquidação. Nenhum tem contrapartida no contas a pagar. Na semana 38 foram R$ 158,08; agora R$ 50,98.","Em duas semanas, R$ 209,06 de custo de carteira que não existe em nenhum relatório de despesa da distribuidora."],"tag":"R$ 50,98","tier":"crit","titulo":"Tarifas de carteira de cobrança sem registro"},{"acao":"Nenhuma. Se em algum momento o cadastro puder ficar no nome do Marcos com o CPF de quem recebe anotado, a conciliação passa a casar sozinha.","foco":false,"paras":["Os registros em nome de Ana Paula Marcondes de Souza (R$ 1.780,00 e R$ 840,00) referem-se ao freelance do Marcos no CD. Ana Paula é irmã dele e recebe por ele — a correspondência está confirmada como correta.","Fica registrada como convenção de cadastro para não voltar como item a corrigir nos próximos fechamentos, como já foi feito com Márcia Cristina e Gabriel Jorge."],"tag":"Esclarecido","tier":"ok","titulo":"Ana Paula e Marcos: de-para confirmado"},{"acao":"Ajustar o registro para o valor pago. Vale checar se a diferença vem de desconto ou de arredondamento na emissão.","foco":true,"paras":["Registrado
