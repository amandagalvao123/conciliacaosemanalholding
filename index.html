    <div class="periodos" id="periodos"><span class="plabel">Período</span></div>
  </div>
  <div id="view"></div>
  <footer>Conciliação bancária semanal · Grupo Ragga Foods · Assessoria de Presidência</footer>
</div>
<script>
(function(){
  "use strict";
  var brl=function(n){return (n==null)?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined&&x!==null)e.textContent=x;return e;}
  function card(){return el('section','card');}
  function h2(p,t,s){p.appendChild(el('h2',null,t));if(s)p.appendChild(el('p','sub',s));}

  var DOCS=[], conta='holding', periodo=null;
  var DB=null, STATUS={}, filtroConta='todas';
  function slug(t){
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
            .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'item';
  }
  function chaveDe(d,p){ return d.id+'--'+slug(p.titulo); }
  function feito(d,p){ var r=STATUS[chaveDe(d,p)]; return !!(r&&r.resolvido); }
  function marcar(d,p,val,cb){
    var k=chaveDe(d,p);
    STATUS[k]={resolvido:val, em:new Date().toISOString()};
    if(cb) cb();
    if(!DB) return;
    try{
      DB.doc('status/'+k).set({resolvido:val, em:new Date().toISOString(),
        conta:d.conta, periodo:d.periodoLabel, titulo:p.titulo}).catch(function(){});
    }catch(e){}
  }
  function dataBR(iso){
    try{ var x=new Date(iso); return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear(); }
    catch(e){ return ''; }
  }
  var tabsEl=document.getElementById('tabs'), perEl=document.getElementById('periodos'),
      viewEl=document.getElementById('view'), statusEl=document.getElementById('dbStatus'),
      dotEl=document.getElementById('markDot'), subEl=document.getElementById('markSub');

  function periodos(){
    var seen={},out=[];
    DOCS.forEach(function(d){ if(!seen[d.periodoLabel]){seen[d.periodoLabel]=1;out.push({lbl:d.periodoLabel,ord:d.ordem||0});} });
    return out.sort(function(a,b){return b.ord-a.ord;});
  }
  function contas(){
    var seen={},out=[];
    DOCS.forEach(function(d){ if(!seen[d.conta]){seen[d.conta]=1;out.push({k:d.conta,lbl:d.contaLabel,cor:d.cor||'#2D204E'});} });
    return out;
  }
  function docAtual(){
    for(var i=0;i<DOCS.length;i++) if(DOCS[i].conta===conta && DOCS[i].periodoLabel===periodo) return DOCS[i];
    return null;
  }

  var drillAberto=null;
  function kpiBlock(p,kpis,onDrill){
    if(!kpis||!kpis.length) return;
    var g=el('div','kpis');
    kpis.forEach(function(k){
      var clic=!!(k.drill&&onDrill);
      var b=el(clic?'button':'div','kpi'+(k.tone?' '+k.tone:'')+(clic?' clic':'')+(clic&&drillAberto===k.drill?' on':''));
      if(clic){ b.type='button'; b.setAttribute('aria-expanded',drillAberto===k.drill?'true':'false'); }
      var kk=el('div','k',k.k);
      if(clic) kk.appendChild(el('span','car','›'));
      b.appendChild(kk);
      b.appendChild(el('div','v',k.v));
      if(k.d) b.appendChild(el('div','d',k.d));
      if(clic) b.addEventListener('click',function(){ onDrill(k.drill); });
      g.appendChild(b);
    });
    p.appendChild(g);
  }
  function amarrBlock(p,blocos){
    (blocos||[]).forEach(function(bloco){
      var box=el('div','amarr');
      bloco.forEach(function(r){
        var row=el('div','row'+(r.tipo?' '+r.tipo:''));
        var l=el('span','lbl',r.lbl);
        if(r.sub) l.appendChild(el('small',null,r.sub));
        if(r.tone==='warnv') l.style.color='var(--warn)';
        row.appendChild(l);
        var v=el('span','val '+(r.tone==='neg'?'neg':(r.tone==='pos'?'pos':'')),'R$ '+brl(r.val));
        if(r.tone==='warnv') v.style.color='var(--warn)';
        row.appendChild(v);
        box.appendChild(row);
      });
      p.appendChild(box);
    });
  }
  /* saldo inicial -> saldo final, uma linha por conta */
  function saldoBlock(p,rows){
    var max=rows.reduce(function(m,r){return Math.max(m,r.ini||0,r.fim||0);},0)||1;
    var box=el('div','sld');
    rows.forEach(function(r){
      var row=el('div','srow');
      var nm=el('div','sname'); var dot=el('i'); dot.style.background=r.cor||'var(--accent)';
      nm.appendChild(dot); nm.appendChild(document.createTextNode(r.nome)); row.appendChild(nm);

      var pair=el('div','spair');
      [['Inicial',r.ini,''],['Final',r.fim,'fim']].forEach(function(x){
        var ln=el('div','sline'+(x[2]?' '+x[2]:''));
        ln.appendChild(el('span','sk',x[0]));
        var tk=el('div','strack'), fl=el('div','sfill');
        fl.style.width=Math.max(0.6,(Math.abs(x[1]||0)/max)*100)+'%';
        if(x[2]) fl.style.background=r.cor||'var(--accent)';
        tk.appendChild(fl); ln.appendChild(tk);
        ln.appendChild(el('span','sv','R$ '+brl(x[1])));
        pair.appendChild(ln);
      });
      row.appendChild(pair);

      var dv=(r.fim||0)-(r.ini||0);
      var pc=r.ini?(dv/Math.abs(r.ini))*100:null;
      var dl=el('div','sdelta '+(dv>=0?'up':'dn'),(dv>=0?'+':'−')+'R$ '+brl(Math.abs(dv)));
      dl.appendChild(el('small',null,pc===null?'variação':(dv>=0?'+':'−')+Math.abs(pc).toFixed(1).replace('.',',')+'%'));
      row.appendChild(dl);
      box.appendChild(row);
    });
    p.appendChild(box);
  }
  /* saldo de fechamento semana a semana, para uma conta */
  function serieBlock(p,pontos,cor){
    var max=pontos.reduce(function(m,x){return Math.max(m,Math.abs(x[1]||0));},0)||1;
    var s=el('div','serie');
    pontos.forEach(function(x,i){
      var b=el('div','sb');
      b.appendChild(el('div','sbv',brl(x[1])));
      var bar=el('div','sbar');
      bar.style.height=Math.max(4,(Math.abs(x[1]||0)/max)*58)+'px';
      bar.style.background=cor||'var(--accent)';
      bar.style.opacity=(i===pontos.length-1)?'1':(0.34+0.2*i);
      b.appendChild(bar);
      b.appendChild(el('div','sbl',x[0]));
      s.appendChild(b);
    });
    p.appendChild(s);
  }
  function barsBlock(p,items,cor,cap){
    var max=items.reduce(function(m,x){return Math.max(m,Math.abs(x[1]));},0)||1;
    var bars=el('div','bars');
    items.forEach(function(x){
      var b=el('div','bar');
      b.appendChild(el('div','bl',x[0]));
      var tk=el('div','track'),fl=el('div','fill');
      fl.style.width=Math.max(0.5,(Math.abs(x[1])/max)*100)+'%';
      fl.style.background=x[2]||cor;
      tk.appendChild(fl);b.appendChild(tk);
      b.appendChild(el('div','bv',brl(x[1])));
      bars.appendChild(b);
    });
    if(cap){var c=el('p','sub',cap);c.style.margin='0 0 12px';p.appendChild(c);}
    p.appendChild(bars);
  }
  function divsBlock(p,list){
    var box=el('div','divs');
    list.forEach(function(d){
      var w=el('div','dv '+(d.tier==='neutral'?'':d.tier));
      w.appendChild(el('div','stripe'));
      var b=el('div');
      var t=el('h3',null,d.titulo);
      if(d.tag) t.appendChild(el('span','tag t-'+(d.tier==='ok'?'ok':(d.tier==='crit'?'crit':(d.tier==='warn'?'warn':'neutral'))),d.tag));
      b.appendChild(t);
      (d.paras||[]).forEach(function(x){ b.appendChild(el('p',null,x)); });
      if(d.acao){ var a=el('p','acao'); a.appendChild(el('b',null,'Ação: ')); a.appendChild(document.createTextNode(d.acao)); b.appendChild(a); }
      w.appendChild(b); box.appendChild(w);
    });
    p.appendChild(box);
  }


  /* ---------- pendências derivadas + modal ---------- */
  function pendsDe(d){   /* o que precisa de correção: não conciliou, não bateu, ou é estranho */
    return (d.divergencias||[]).filter(function(x){return x.foco===true;});
  }
  function processoDe(d){ /* melhorias de cadastro e rotina — ficam fora da tela da holding */
    return (d.divergencias||[]).filter(function(x){
      return (x.tier==='crit'||x.tier==='warn') && x.foco!==true;
    });
  }
  var verProcesso=false;
  var ovlEl=null, lastFocus=null;
  function fecharModal(){
    if(!ovlEl) return;
    ovlEl.remove(); ovlEl=null;
    document.body.style.overflow='';
    document.removeEventListener('keydown',escHandler);
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function escHandler(e){ if(e.key==='Escape') fecharModal(); }
  function abrirModal(d,p){
    fecharModal();
    lastFocus=document.activeElement;
    var ovl=el('div','ovl');
    ovl.addEventListener('click',function(e){ if(e.target===ovl) fecharModal(); });
    var m=el('div','modal');
    m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.tabIndex=-1;
    var top=el('div','mtop');
    var left=el('div');
    var ct=el('div','mconta');
    var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
    ct.appendChild(cd);
    ct.appendChild(document.createTextNode(d.contaLabel+' · '+d.periodoLabel));
    left.appendChild(ct);
    var t=el('h3',null,p.titulo);
    if(p.tag) t.appendChild(el('span','tag t-'+(p.tier==='crit'?'crit':'warn'),p.tag));
    left.appendChild(t);
    top.appendChild(left);
    var x=el('button','xbtn','×'); x.type='button'; x.setAttribute('aria-label','Fechar');
    x.addEventListener('click',fecharModal);
    top.appendChild(x);
    m.appendChild(top);
    (p.paras||[]).forEach(function(tx){ m.appendChild(el('p',null,tx)); });
    if(p.acao){
      var box=el('div','acaobox');
      box.appendChild(el('div','al','Ação'));
      box.appendChild(el('p',null,p.acao));
      m.appendChild(box);
    }
    var foot=el('div','mfoot');
    var go=el('button','btn','Abrir a aba '+d.contaLabel); go.type='button';
    go.addEventListener('click',function(){ fecharModal(); conta=d.conta; render(); window.scrollTo(0,0); });
    foot.appendChild(go);
    var cl=el('button','btn','Fechar'); cl.type='button';
    cl.addEventListener('click',fecharModal);
    foot.appendChild(cl);
    m.appendChild(foot);
    ovl.appendChild(m);
    document.body.appendChild(ovl);
    document.body.style.overflow='hidden';
    document.addEventListener('keydown',escHandler);
    m.focus();
    ovlEl=ovl;
  }


  /* ---------- aberturas dos KPIs ---------- */
  var ROT={'sem-registro':'Lançamento no banco sem registro no contas a pagar',
           'maior':'Pago acima do valor registrado',
           'menor':'Pago abaixo do valor registrado'};
  function drillDiferenca(doArr,total){
    var box=el('div','drillbox');
    box.appendChild(el('h5',null,'Composição da diferença'));
    box.appendChild(el('p','hint2','Tudo que separa o que saiu do banco do que está registrado no contas a pagar. Valores negativos foram pagos abaixo do registrado e reduzem a diferença.'));
    var algum=false;
    doArr.forEach(function(d){
      var itens=d.composicaoDif||[];
      if(!itens.length) return;
      algum=true;
      var g=el('div','dgrp');
      var gh=el('div','gh');
      var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
      gh.appendChild(cd); gh.appendChild(document.createTextNode(d.contaLabel));
      var sub=el('span','sub','R$ '+brl(itens.reduce(function(a,x){return a+x.v;},0)));
      gh.appendChild(sub); g.appendChild(gh);
      itens.forEach(function(x){
        var l=el('div','dline');
        l.appendChild(el('div','dt2',x.dt));
        var c=el('div'); c.appendChild(document.createTextNode(x.desc));
        c.appendChild(el('span','tp',ROT[x.tipo]||x.tipo));
        l.appendChild(c);
        var v=el('div','v2',(x.v<0?'− ':'')+brl(Math.abs(x.v)));
        v.style.color = x.v<0 ? 'var(--ok)' : 'var(--warn)';
        l.appendChild(v);
        g.appendChild(l);
      });
      box.appendChild(g);
    });
    if(!algum) box.appendChild(el('div','empty','Nenhuma diferença no período: tudo que saiu do banco tem registro no contas a pagar, pelo mesmo valor.'));
    else {
      var t=el('div','dtot');
      t.appendChild(el('span',null,'Diferença do período'));
      t.appendChild(el('span','v2','R$ '+brl(total)));
      box.appendChild(t);
    }
    return box;
  }
  function drillCorrigir(doArr,total){
    var box=el('div','drillbox');
    box.appendChild(el('h5',null,'Pagamentos a corrigir por conta'));
    box.appendChild(el('p','hint2','Quantos itens cada conta tem em aberto e quais são os maiores. Clique numa conta para filtrar a lista completa abaixo.'));
    var algum=false;
    doArr.forEach(function(d){
      var lst=pendsDe(d).filter(function(p){return !feito(d,p);});
      if(!lst.length) return;
      algum=true;
      var nc=lst.filter(function(p){return p.tier==='crit';}).length;
      var g=el('div','dgrp');
      var gh=el('div','gh'); gh.style.cursor='pointer';
      var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
      gh.appendChild(cd); gh.appendChild(document.createTextNode(d.contaLabel));
      gh.appendChild(el('span','tag '+(nc?'t-crit':'t-warn'), nc? nc+' críticos de '+lst.length : lst.length+' itens'));
      var sub=el('span','sub','›'); gh.appendChild(sub);
      gh.addEventListener('click',function(){ filtroConta=d.conta; drillAberto=null; renderHolding(); });
      g.appendChild(gh);
      lst.slice(0,3).forEach(function(p){
        var l=el('div','dline');
        l.appendChild(el('div','dt2',p.tier==='crit'?'crítico':'atenção'));
        var c=el('div'); c.appendChild(document.createTextNode(p.titulo));
        if(p.acao) c.appendChild(el('span','tp',p.acao.length>110?p.acao.slice(0,110)+'…':p.acao));
        l.appendChild(c);
        var v=el('div','v2',p.tag||'');
        v.style.color = p.tier==='crit' ? 'var(--crit)' : 'var(--warn)';
        l.appendChild(v);
        g.appendChild(l);
      });
      if(lst.length>3){
        var m=el('div','dline');
        m.appendChild(el('div','dt2',''));
        m.appendChild(el('div',null,'+ '+(lst.length-3)+' outros itens desta conta'));
        m.appendChild(el('div','v2',''));
        g.appendChild(m);
      }
      box.appendChild(g);
    });
    if(!algum) box.appendChild(el('div','empty','Nada a corrigir neste período.'));
    else {
      var t=el('div','dtot');
      t.appendChild(el('span',null,'Total em aberto'));
      t.appendChild(el('span','v2',String(total)+' itens'));
      box.appendChild(t);
    }
    return box;
  }
  /* ---------- aba holding ---------- */
  function renderHolding(){
    viewEl.innerHTML='';
    document.documentElement.style.setProperty('--accent','#2D204E');
    dotEl.style.background='#2D204E'; subEl.textContent='Visão consolidada da holding';

    var doArr=DOCS.filter(function(d){return d.periodoLabel===periodo;});
    var hd=el('header','head');
    hd.appendChild(el('p','eyebrow','Fechamento semanal · Semana '+(doArr[0]&&doArr[0].semana||'—')+' de 2026'));
    hd.appendChild(el('h1',null,'Conciliação bancária — visão da holding'));
    hd.appendChild(el('p',null,'Confronto entre extrato bancário e contas a pagar, conta por conta. Cada fechamento fica salvo por período; use as abas acima para abrir o detalhe de cada empresa.'));
    var mt=el('div','headmeta');
    [['Período',periodo||'—'],['Contas fechadas',String(doArr.length)],['Emitido',doArr[0]&&doArr[0].emitido?doArr[0].emitido.split('-').reverse().join('/'):'—']]
      .forEach(function(c){var s=el('span','chip',c[0]+' ');s.appendChild(el('b',null,c[1]));mt.appendChild(s);});
    hd.appendChild(mt); viewEl.appendChild(hd);

    if(!doArr.length){
      var c0=card(); h2(c0,'Sem fechamentos neste período');
      c0.appendChild(el('div','empty','Nenhuma conta foi conciliada para o período selecionado.'));
      viewEl.appendChild(c0); return;
    }

    var tcp=0,tdif=0,treg=0,tconc=0,tpend=0,tcred=0,ncritK=0;
    doArr.forEach(function(d){ tcp+=d.totalCP||0; tdif+=(d.diferenca||0)+(d.tarifasTotal&&!d.diferenca?d.tarifasTotal:0);
      treg+=d.registros||0; tconc+=d.conciliados||0; tpend+=pendsDe(d).filter(function(p){return !feito(d,p);}).length; tcred+=d.creditos||0; ncritK+=pendsDe(d).filter(function(p){return p.tier==='crit'&&!feito(d,p);}).length; });

    var c1=card();
    h2(c1,'Consolidado do período','Soma das contas conciliadas em '+periodo+'.');
    kpiBlock(c1,[
      {k:'Contas conciliadas',v:doArr.length+' / '+doArr.length,d:'Todas fechadas no período',tone:'hero'},
      {k:'Total pago',v:brl(tcp),d:treg+' registros de contas a pagar'},
      {k:'Total recebido',v:brl(tcred),d:'Créditos no período'},
      {k:'Diferença não registrada',v:brl(tdif),d:'clique para ver a composição',tone:'warn',drill:'dif'},
      {k:'Pagamentos a corrigir',v:String(tpend),d:ncritK+' críticos · clique para ver por conta',tone:tpend?'warn':'hero',drill:'corrigir'}
    ], function(id){ drillAberto = (drillAberto===id? null : id); renderHolding(); });

    if(drillAberto==='dif') c1.appendChild(drillDiferenca(doArr,tdif));
    if(drillAberto==='corrigir') c1.appendChild(drillCorrigir(doArr,tpend));
    var grid=el('div','contagrid');
    doArr.forEach(function(d){
      var b=el('div','conta'); b.tabIndex=0; b.setAttribute('role','button');
      var t=el('div','ct'); var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
      t.appendChild(cd); t.appendChild(document.createTextNode(d.contaLabel)); b.appendChild(t);
      b.appendChild(el('div','cs',d.contaDetalhe||''));
      var g=el('div','cg');
      [['Contas a pagar',brl(d.totalCP),''],['Conciliado',(d.conciliados||0)+'/'+(d.registros||0),''],
       ['Saldo final',brl(d.saldoFinal),(d.saldoFinal!=null&&d.saldoFinal<20000)?'var(--crit)':''],
       ['Diferença',brl(d.diferenca||d.tarifasTotal||0),(d.diferenca||d.tarifasTotal)?'var(--warn)':'']]
      .forEach(function(x){
        var w=el('div'); w.appendChild(el('div','l',x[0]));
        var n=el('div','n',x[1]); if(x[2]) n.style.color=x[2];
        w.appendChild(n); g.appendChild(w);
      });
      b.appendChild(g);
      var pend=pendsDe(d).filter(function(p){return !feito(d,p);}).length;
      b.appendChild(el('span','tag '+(pend?'t-warn':'t-ok'),pend?pend+(pend===1?' a corrigir':' a corrigir'):'Nada a corrigir'));
      var go=function(){ filtroConta=d.conta; renderHolding(); window.scrollTo(0,0); };
      b.addEventListener('click',go);
      b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
      grid.appendChild(b);
    });
    c1.appendChild(grid);
    viewEl.appendChild(c1);

    /* saldo inicial -> saldo final */
    var comSaldo=doArr.filter(function(d){return d.saldoAnterior!=null&&d.saldoFinal!=null;});
    if(comSaldo.length){
      var cs=card();
      var sIni=comSaldo.reduce(function(a,d){return a+d.saldoAnterior;},0);
      var sFim=comSaldo.reduce(function(a,d){return a+d.saldoFinal;},0);
      var sDv=sFim-sIni, sPc=sIni?(sDv/Math.abs(sIni))*100:0;
      var semSaldo=doArr.length-comSaldo.length;
      h2(cs,'Saldo das contas — início e fim do período',
        'Quanto havia em conta na abertura de '+periodo+' e quanto restou no fechamento. A soma cobre '
        +comSaldo.length+(comSaldo.length===1?' conta':' contas')
        +(semSaldo?'; a'+(semSaldo===1?' conta':'s contas')+' sem posição de saldo no período fica'+(semSaldo===1?'':'m')+' indicada'+(semSaldo===1?'':'s')+' abaixo.':'.'));
      kpiBlock(cs,[
        {k:'Saldo inicial',v:brl(sIni),d:comSaldo.length+' contas com posição de saldo'},
        {k:'Saldo final',v:brl(sFim),d:'no último dia conciliado',tone:'hero'},
        {k:'Variação',v:(sDv>=0?'+':'−')+brl(Math.abs(sDv)),
         d:(sDv>=0?'+':'−')+Math.abs(sPc).toFixed(1).replace('.',',')+'% no período',tone:sDv>=0?'pos':'warn'}
      ]);
      saldoBlock(cs,comSaldo.map(function(d){
        return {nome:d.contaLabel,cor:d.cor,ini:d.saldoAnterior,fim:d.saldoFinal};
      }));
      comSaldo.forEach(function(d){
        if(d.saldoObs) cs.appendChild(el('p','sldnote',d.contaLabel+': '+d.saldoObs));
      });
      doArr.filter(function(d){return d.saldoAnterior==null||d.saldoFinal==null;}).forEach(function(d){
        cs.appendChild(el('p','sldnote',d.contaLabel+': '+(d.saldoObs||'sem posição de saldo no arquivo enviado para este período.')));
      });
      viewEl.appendChild(cs);
    }

    var c2=card();
    var ncrit=doArr.reduce(function(a,d){return a+pendsDe(d).filter(function(p){return p.tier==='crit';}).length;},0);
    var nproc=doArr.reduce(function(a,d){return a+processoDe(d).length;},0);
    h2(c2,'Pagamentos a corrigir',
      tpend+' itens no período: lançamentos que não conciliaram, valores que não bateram e pagamentos que pedem confirmação — '
      +ncrit+' críticos. Marque cada um conforme for resolvendo; o estado fica salvo.');
    if(!DB){
      var av=el('p','sub','Esta é uma cópia offline do painel: as marcações valem enquanto a página estiver aberta e não ficam salvas. Para registrar o que foi corrigido, use o painel publicado.');
      av.style.cssText='margin:-6px 0 16px;color:var(--warn)';
      c2.appendChild(av);
    }
    if(nproc){
      var tg=el('div','rowhead'); tg.style.marginTop='-6px';
      var bt=el('button','btn',(verProcesso?'Ocultar':'Ver também')+' melhorias de cadastro e rotina ('+nproc+')');
      bt.type='button';
      bt.addEventListener('click',function(){ verProcesso=!verProcesso; renderHolding(); });
      tg.appendChild(bt); c2.appendChild(tg);
    }
    /* filtros por conta */
    var itens=[];
    doArr.forEach(function(d){
      pendsDe(d).concat(verProcesso?processoDe(d):[]).forEach(function(p){ itens.push({d:d,p:p}); });
    });
    var abertos=itens.filter(function(x){return !feito(x.d,x.p);});
    var prontos=itens.filter(function(x){return feito(x.d,x.p);});

    var fl=el('div','filtros');
    function chip(k,label,cor,n,ativo){
      var b=el('button','fchip'+(ativo?' on':'')); b.type='button';
      if(cor){ var c=el('span','cd'); c.style.background=cor; b.appendChild(c); }
      b.appendChild(document.createTextNode(label));
      b.appendChild(el('span','n',String(n)));
      b.addEventListener('click',function(){ filtroConta=k; renderHolding(); });
      return b;
    }
    fl.appendChild(chip('todas','Todas as contas',null,abertos.length,filtroConta==='todas'));
    doArr.forEach(function(d){
      var n=pendsDe(d).concat(verProcesso?processoDe(d):[]).filter(function(p){return !feito(d,p);}).length;
      fl.appendChild(chip(d.conta,d.contaLabel,d.cor,n,filtroConta===d.conta));
    });
    c2.appendChild(fl);

    var vis=abertos.filter(function(x){ return filtroConta==='todas'||x.d.conta===filtroConta; });
    vis.sort(function(a,b){
      if((a.p.tier==='crit')!==(b.p.tier==='crit')) return a.p.tier==='crit'?-1:1;
      return String(a.d.contaLabel).localeCompare(String(b.d.contaLabel));
    });

    function linha(x,done){
      var d=x.d,p=x.p;
      var w=el('div','fix'+(p.tier==='crit'?' crit':' warnv')+(done?' done':''));
      w.appendChild(el('div','sev'));
      var bd=el('div','bd');
      var l1=el('div','l1');
      var ct=el('span','conta'); var cd=el('span','cd'); cd.style.background=d.cor||'#2D204E';
      ct.appendChild(cd); ct.appendChild(document.createTextNode(d.contaLabel));
      l1.appendChild(ct);
      l1.appendChild(el('h4',null,p.titulo));
      if(p.tag) l1.appendChild(el('span','val',p.tag));
      bd.appendChild(l1);
      if(!done){
        (p.paras||[]).slice(0,1).forEach(function(t){ bd.appendChild(el('p',null,t)); });
        if(p.acao){
          var a=el('div','acao'); a.appendChild(el('b',null,'O que fazer'));
          a.appendChild(document.createTextNode(p.acao)); bd.appendChild(a);
        }
      }
      var l3=el('div','l3');
      var lab=el('label','chk');
      var cbx=document.createElement('input'); cbx.type='checkbox'; cbx.checked=done;
      cbx.addEventListener('change',function(){ marcar(d,p,cbx.checked,function(){ renderHolding(); }); });
      lab.appendChild(cbx);
      lab.appendChild(document.createTextNode(done?'Corrigido':'Marcar como corrigido'));
      l3.appendChild(lab);
      if(!done && (p.paras||[]).length>1){
        var mais=el('button','btn','Ver detalhe completo'); mais.type='button';
        mais.addEventListener('click',function(){ abrirModal(d,p); });
        l3.appendChild(mais);
      }
      var ir=el('button','btn','Abrir '+d.contaLabel); ir.type='button';
      ir.addEventListener('click',function(){ conta=d.conta; render(); window.scrollTo(0,0); });
      l3.appendChild(ir);
      var st=STATUS[chaveDe(d,p)];
      if(done && st && st.em) l3.appendChild(el('span','quando','em '+dataBR(st.em)));
      bd.appendChild(l3);
      w.appendChild(bd);
      return w;
    }

    if(!vis.length){
      var e2=el('div','empty');
      e2.appendChild(el('b',null, abertos.length? 'Nada a corrigir nesta conta' : 'Tudo corrigido neste período'));
      e2.appendChild(document.createTextNode(abertos.length? 'Troque o filtro acima para ver os itens das outras contas.'
        : 'Todos os itens do período foram marcados como corrigidos.'));
      c2.appendChild(e2);
    } else {
      var box=el('div','fixlist');
      vis.forEach(function(x){ box.appendChild(linha(x,false)); });
      c2.appendChild(box);
    }

    if(prontos.length){
      var det=document.createElement('details'); det.className='doneblock';
      var sm=document.createElement('summary');
      sm.textContent='Corrigidos neste período ('+prontos.length+')';
      det.appendChild(sm);
      var bx=el('div','fixlist');
      prontos.forEach(function(x){ bx.appendChild(linha(x,true)); });
      det.appendChild(bx);
      c2.appendChild(det);
    }
    viewEl.appendChild(c2);

    var c3=card();
    h2(c3,'Histórico por conta','Série de fechamentos gravados, mais recente primeiro.');
    var tw=el('div','tw'), tb=el('table'); tb.style.minWidth='820px';
    var th=el('thead'),htr=el('tr');
    ['Período','Conta','Registros','Contas a pagar','Recebido','Saldo final','Diferença','A corrigir']
      .forEach(function(h,i){htr.appendChild(el('th',(i>=2)?'r':null,h));});
    th.appendChild(htr); tb.appendChild(th);
    var tbd=el('tbody');
    DOCS.forEach(function(d){
      var tr=el('tr');
      tr.appendChild(el('td','dt',d.periodoLabel));
      var c=el('td'); c.appendChild(el('b',null,d.contaLabel));
      c.appendChild(el('span','note',d.contaDetalhe||'')); tr.appendChild(c);
      tr.appendChild(el('td','r money',(d.conciliados||0)+'/'+(d.registros||0)));
      tr.appendChild(el('td','r money',brl(d.totalCP)));
      tr.appendChild(el('td','r money',brl(d.creditos)));
      var sf=el('td','r money',brl(d.saldoFinal));
      if(d.saldoFinal!=null&&d.saldoFinal<20000) sf.style.color='var(--crit)';
      tr.appendChild(sf);
      var df=el('td','r money',brl(d.diferenca||d.tarifasTotal||0));
      if(d.diferenca||d.tarifasTotal) df.style.color='var(--warn)';
      tr.appendChild(df);
      tr.appendChild(el('td','r money',String(pendsDe(d).filter(function(p){return !feito(d,p);}).length)));
      tbd.appendChild(tr);
    });
    tb.appendChild(tbd); tw.appendChild(tb); c3.appendChild(tw);
    viewEl.appendChild(c3);
  }

  /* ---------- aba de conta ---------- */
  function renderConta(){
    viewEl.innerHTML='';
    var d=docAtual();
    var meta=contas().filter(function(x){return x.k===conta;})[0]||{cor:'#2D204E',lbl:conta};
    document.documentElement.style.setProperty('--accent',meta.cor);
    dotEl.style.background=meta.cor;
    subEl.textContent=(d&&d.contaDetalhe)||meta.lbl;

    if(!d){
      var c0=card();
      h2(c0,meta.lbl+' — sem fechamento neste período');
      var e=el('div','empty');
      e.appendChild(el('b',null,'Nada conciliado em '+periodo));
      e.appendChild(document.createTextNode('Escolha outro período acima ou envie o extrato e o contas a pagar desta conta para o período.'));
      c0.appendChild(e); viewEl.appendChild(c0); return;
    }

    var hd=el('header','head');
    hd.appendChild(el('p','eyebrow','Fechamento semanal · Semana '+(d.semana||'—')+' de 2026'));
    hd.appendChild(el('h1',null,'Extrato × Contas a pagar — '+d.contaLabel+(d.razaoSocial?'':'')));
    hd.appendChild(el('p',null,d.chamada||''));
    var mt=el('div','headmeta');
    [['Período',d.periodoLabel],['Conta',(d.contaDetalhe||'').split('· ')[1]||d.contaLabel],
     ['Emitido',(d.emitido||'').split('-').reverse().join('/')]]
      .forEach(function(c){var s=el('span','chip',c[0]+' ');s.appendChild(el('b',null,c[1]));mt.appendChild(s);});
    hd.appendChild(mt); viewEl.appendChild(hd);

    /* resumo */
    var c1=card();
    h2(c1,'Resumo da conciliação',d.lancamentos+' lançamentos no extrato contra '+d.registros+' registros de contas a pagar.');
    kpiBlock(c1,d.kpis);
    if(d.leitura&&d.leitura.length){
      var tw=el('div','tw'),tb=el('table');
      var th=el('thead'),htr=el('tr');
      ['Leitura','Registros','Valor','Situação'].forEach(function(h,i){htr.appendChild(el('th',(i===1||i===2)?'r':null,h));});
      th.appendChild(htr);tb.appendChild(th);
      var tbd=el('tbody');
      d.leitura.forEach(function(l){
        var tr=el('tr');
        if(l.tone==='crit') tr.className='rowcrit'; else if(l.tone==='warn') tr.className='rowwarn';
        var c=el('td'); c.appendChild(document.createTextNode(l.txt));
        if(l.nota) c.appendChild(el('span','note',l.nota));
        tr.appendChild(c);
        tr.appendChild(el('td','r money',l.n));
        tr.appendChild(el('td','r money',l.valor==null?'—':'R$ '+brl(l.valor)));
        var s=el('td'); s.appendChild(el('span','tag t-'+(l.tone||'neutral'),l.tag)); tr.appendChild(s);
        tbd.appendChild(tr);
      });
      tb.appendChild(tbd);tw.appendChild(tb);c1.appendChild(tw);
    }
    viewEl.appendChild(c1);

    /* saldo inicial -> saldo final desta conta */
    if(d.saldoAnterior!=null&&d.saldoFinal!=null){
      var cS=card();
      var dv=d.saldoFinal-d.saldoAnterior, pc=d.saldoAnterior?(dv/Math.abs(d.saldoAnterior))*100:0;
      h2(cS,'Saldo inicial e saldo final','Quanto a conta tinha na abertura de '+d.periodoLabel+' e quanto restou no último dia conciliado.');
      kpiBlock(cS,[
        {k:'Saldo inicial',v:brl(d.saldoAnterior),d:'= fechamento da semana anterior'},
        {k:'Saldo final',v:brl(d.saldoFinal),d:'conferido com o extrato',tone:'hero'},
        {k:'Variação',v:(dv>=0?'+':'−')+brl(Math.abs(dv)),
         d:(dv>=0?'+':'−')+Math.abs(pc).toFixed(1).replace('.',',')+'% no período',tone:dv>=0?'pos':'warn'}
      ]);
      saldoBlock(cS,[{nome:d.contaLabel,cor:meta.cor,ini:d.saldoAnterior,fim:d.saldoFinal}]);
      if(d.saldoObs) cS.appendChild(el('p','sldnote',d.saldoObs));
      var hist=DOCS.filter(function(x){return x.conta===d.conta&&x.saldoFinal!=null;})
                   .sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
      if(hist.length>1){
        var capS=el('p','sub','Saldo de fechamento, semana a semana'); capS.style.margin='24px 0 6px';
        cS.appendChild(capS);
        serieBlock(cS,hist.map(function(x){return [x.periodoLabel,x.saldoFinal];}),meta.cor);
      }
      viewEl.appendChild(cS);
    }

    /* amarração */
    var c2=card();
    h2(c2,'Amarração de saldo','A conferência de que nenhum lançamento ficou de fora do período.');
    if(d.alerta){
      divsBlock(c2,[{tier:'crit',titulo:d.alerta.titulo,tag:d.alerta.tag,paras:d.alerta.paras,acao:d.alerta.acao}]);
      c2.lastChild.style.marginBottom='20px';
    }
    amarrBlock(c2,d.amarracao);
    if(d.saldoDia&&d.saldoDia.length){
      var items=d.saldoDia.map(function(s){
        var cor=s[1]<20000?'var(--crit)':(s[1]<60000?'var(--warn)':meta.cor);
        return [s[0],s[1],cor];
      });
      var cap=el('p','sub','Saldo dia a dia'); cap.style.margin='22px 0 12px'; c2.appendChild(cap);
      barsBlock(c2,items,meta.cor,null);
    }
    viewEl.appendChild(c2);

    /* entradas */
    if(d.entradas){
      var c3=card();
      h2(c3,'Entradas do período','De onde veio o dinheiro que sustentou os pagamentos da semana.');
      kpiBlock(c3,d.entradas.kpis);
      if(d.entradas.lojas&&d.entradas.lojas.length)
        barsBlock(c3,d.entradas.lojas.map(function(l){return [l.loja+' ('+l.n+')',l.v];}),meta.cor,'Repasses por loja');
      viewEl.appendChild(c3);
    }

    /* de-para */
    var c4=card();
    h2(c4,'De-para conciliado','Cada registro de contas a pagar e o lançamento correspondente no extrato.');
    var temDet=d.depara.some(function(r){return r.det&&r.det.length;});
    var temDiv=d.depara.some(function(r){return r.tone!=='ok';});
    if(temDet){
      var hint=el('p','hint'); hint.appendChild(el('span','disc','›'));
      hint.appendChild(document.createTextNode('Linhas com seta abrem o detalhe das saídas consideradas — clique para expandir.'));
      c4.appendChild(hint);
    }
    var rh=el('div','rowhead');
    var info=el('span','pill'); rh.appendChild(info);
    if(temDiv){
      var grp=el('span'); grp.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
      ['todos','div'].forEach(function(f){
        var b=el('button','btn',f==='todos'?'Todos':'Só divergentes'); b.type='button';
        b.addEventListener('click',function(){draw(f==='div');});
        grp.appendChild(b);
      });
      rh.appendChild(grp);
    }
    c4.appendChild(rh);
    var tw2=el('div','tw'),tb2=el('table'),thd=el('thead'),h2r=el('tr');
    ['Dt.','Fornecedor no cadastro','Centro de custo','Lançamento no extrato','Valor','Status']
      .forEach(function(h,i){h2r.appendChild(el('th',i===4?'r':null,h));});
    thd.appendChild(h2r);tb2.appendChild(thd);
    var body2=el('tbody');tb2.appendChild(body2);
    var tf=el('tfoot'),ftr=el('tr');
    var fc=el('td',null,'Total conciliado');fc.colSpan=4;ftr.appendChild(fc);
    ftr.appendChild(el('td','r money',brl(d.totalCP)));ftr.appendChild(el('td'));
    tf.appendChild(ftr);tb2.appendChild(tf);
    tw2.appendChild(tb2);c4.appendChild(tw2);

    function draw(only){
      body2.innerHTML='';
      var n=0,soma=0;
      d.depara.forEach(function(r){
        if(only&&r.tone==='ok') return;
        n++;soma+=r.v;
        var tr=el('tr');
        if(r.tone==='crit') tr.className='rowcrit';
        var hasDet=!!(r.det&&r.det.length);
        if(hasDet){tr.className+=(tr.className?' ':'')+'parent';tr.tabIndex=0;tr.setAttribute('role','button');tr.setAttribute('aria-expanded','false');}
        tr.appendChild(el('td','dt',r.dt));
        var c=el('td');
        var line=el('div','fornline');
        if(hasDet) line.appendChild(el('span','disc','›'));
        var inn=el('div'); inn.appendChild(el('b',null,r.f));
        if(r.nota) inn.appendChild(el('span','note',r.nota));
        line.appendChild(inn); c.appendChild(line); tr.appendChild(c);
        tr.appendChild(el('td',null,r.cc));
        var e=el('td'); e.appendChild(document.createTextNode(r.ext));
        if(r.extDoc) e.appendChild(el('span','note',r.extDoc));
        tr.appendChild(e);
        tr.appendChild(el('td','r money',brl(r.v)));
        var s=el('td'); s.appendChild(el('span','tag t-'+r.tone,r.tag)); tr.appendChild(s);
        body2.appendChild(tr);
        if(hasDet){
          var ctr=el('tr','child'); ctr.hidden=true;
          var ctd=el('td'); ctd.colSpan=6;
          var dr=el('div','drill');
          dr.appendChild(el('h5',null,'Saídas consideradas'));
          if(r.how) dr.appendChild(el('p','how',r.how));
          var dt2=el('table','dtab'),dtb=el('tbody'),sm=0;
          r.det.forEach(function(x){
            sm+=x.v;
            var row=el('tr');
            row.appendChild(el('td',null,x.d));
            row.appendChild(el('td','dt',x.doc));
            var v=el('td','r money',(x.v<0?'− ':'')+brl(Math.abs(x.v)));
            if(x.v<0) v.style.color='var(--ok)';
            row.appendChild(v); dtb.appendChild(row);
          });
          var tot=el('tr','dtot');
          tot.appendChild(el('td',null,r.det.length+' saídas consideradas'));
          tot.appendChild(el('td','dt','= registro de '+brl(r.v)));
          tot.appendChild(el('td','r money',brl(Math.round(sm*100)/100)));
          dtb.appendChild(tot); dt2.appendChild(dtb); dr.appendChild(dt2);
          ctd.appendChild(dr); ctr.appendChild(ctd); body2.appendChild(ctr);
          var tg=function(){
            var op=ctr.hidden; ctr.hidden=!op;
            tr.classList.toggle('open',op); tr.setAttribute('aria-expanded',op?'true':'false');
          };
          tr.addEventListener('click',tg);
          tr.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tg();}});
        }
      });
      info.textContent=n+' registros · R$ '+brl(Math.round(soma*100)/100);
    }
    draw(false);
    viewEl.appendChild(c4);

    /* sem registro */
    if(d.semRegistro&&d.semRegistro.length){
      var c5=card();
      var tot=d.semRegistro.reduce(function(a,x){return a+x.v;},0);
      h2(c5,'Lançamentos sem registro no contas a pagar',
        d.semRegistro.length+' lançamento(s) somando R$ '+brl(Math.round(tot*100)/100)+' — é a diferença da semana.');
      var tw3=el('div','tw'),tb3=el('table');tb3.style.minWidth='520px';
      var th3=el('thead'),h3r=el('tr');
      ['Data','Descrição','Valor','Natureza'].forEach(function(h,i){h3r.appendChild(el('th',i===2?'r':null,h));});
      th3.appendChild(h3r);tb3.appendChild(th3);
      var tbd3=el('tbody');
      d.semRegistro.forEach(function(x){
        var tr=el('tr','rowcrit');
        tr.appendChild(el('td','dt',x.dt));
        tr.appendChild(el('td',null,x.d));
        tr.appendChild(el('td','r money',brl(x.v)));
        tr.appendChild(el('td',null,x.nat||'Tarifa'));
        tbd3.appendChild(tr);
      });
      tb3.appendChild(tbd3);
      var tf3=el('tfoot'),f3=el('tr');
      f3.style.cssText='background:var(--crit-soft);color:var(--crit)';
      f3.appendChild(el('td',null,'Total'));f3.appendChild(el('td',null,'Diferença da semana'));
      f3.appendChild(el('td','r money',brl(Math.round(tot*100)/100)));f3.appendChild(el('td'));
      tf3.appendChild(f3);tb3.appendChild(tf3);
      tw3.appendChild(tb3);c5.appendChild(tw3);
      viewEl.appendChild(c5);
    }

    /* anexos */
    (d.anexos||[]).forEach(function(a){
      var c=card(); h2(c,a.titulo,a.sub);
      var tw4=el('div','tw'),tb4=el('table');tb4.style.minWidth='860px';
      var th4=el('thead'),h4=el('tr');
      a.cols.forEach(function(x,i){h4.appendChild(el('th',(a.aligns&&a.aligns[i]==='r')?'r':null,x));});
      th4.appendChild(h4);tb4.appendChild(th4);
      var tbd4=el('tbody');
      a.rows.forEach(function(row){
        var tr=el('tr');
        row.forEach(function(cell,i){
          if(i===row.length-1&&String(cell).indexOf(':')>0){
            var parts=String(cell).split(':');
            if(parts[0]==='crit') tr.className='rowcrit';
            var td=el('td'); td.appendChild(el('span','tag t-'+parts[0],parts[1])); tr.appendChild(td);
          } else {
            tr.appendChild(el('td',(a.aligns&&a.aligns[i]==='r')?'r money':null,cell));
          }
        });
        tbd4.appendChild(tr);
      });
      tb4.appendChild(tbd4);
      if(a.foot){
        var tf4=el('tfoot'),f4=el('tr');
        a.foot.forEach(function(cell,i){f4.appendChild(el('td',(a.aligns&&a.aligns[i]==='r')?'r money':null,cell));});
        tf4.appendChild(f4);tb4.appendChild(tf4);
      }
      tw4.appendChild(tb4);c.appendChild(tw4);
      viewEl.appendChild(c);
    });

    /* divergências */
    var foco=pendsDe(d), proc=processoDe(d), resolv=(d.divergencias||[]).filter(function(x){return x.tier!=='crit'&&x.tier!=='warn';});
    if(foco.length){
      var c6=card();
      h2(c6,'Pagamentos a corrigir',foco.length+' itens que não conciliaram, não bateram ou pedem confirmação.');
      divsBlock(c6,foco); viewEl.appendChild(c6);
    }
    if(proc.length){
      var c6b=card();
      h2(c6b,'Melhorias de cadastro e rotina',proc.length+' ajustes que reduzem o trabalho manual das próximas conciliações.');
      divsBlock(c6b,proc); viewEl.appendChild(c6b);
    }
    if(resolv.length){
      var c6c=card();
      h2(c6c,'Confirmado e resolvido',resolv.length+' pontos esclarecidos ou fechados.');
      divsBlock(c6c,resolv); viewEl.appendChild(c6c);
    }

    /* histórico da conta */
    var c7=card();
    var serie=DOCS.filter(function(x){return x.conta===conta;});
    h2(c7,'Histórico da conta',serie.length+(serie.length===1?' fechamento gravado.':' fechamentos gravados.'));
    var tw5=el('div','tw'),tb5=el('table');tb5.style.minWidth='760px';
    var th5=el('thead'),h5=el('tr');
    ['Período','Registros','Contas a pagar','Recebido','Saldo final','Diferença','Pendências','Status']
      .forEach(function(h,i){h5.appendChild(el('th',(i>=1&&i<=6)?'r':null,h));});
    th5.appendChild(h5);tb5.appendChild(th5);
    var tbd5=el('tbody');
    serie.forEach(function(x){
      var tr=el('tr');
      if(x.periodoLabel===periodo) tr.style.background='var(--accent-soft)';
      tr.appendChild(el('td','dt',x.periodoLabel));
      tr.appendChild(el('td','r money',(x.conciliados||0)+'/'+(x.registros||0)));
      tr.appendChild(el('td','r money',brl(x.totalCP)));
      tr.appendChild(el('td','r money',brl(x.creditos)));
      var sf=el('td','r money',brl(x.saldoFinal));
      if(x.saldoFinal!=null&&x.saldoFinal<20000) sf.style.color='var(--crit)';

o. O que registro aqui é o desenho: rescindir e recontratar como autônomo em 48 horas, com a mesma função e no mesmo local, é a configuração clássica de continuidade de vínculo.","Vale somar a isso o quadro de freelancers da janela: treze pagamentos a seis pessoas em cinco dias, R$ 4.045,00. O Júnior recebeu R$ 2.200,00 em duas semanas por diárias de produção de carnes, e o Nathan teve cinco pagamentos na mesma semana."],"acao":"Levar ao RH e ao jurídico. Se a produção precisa de reforço contínuo, contratar é mais barato do que o passivo; se é eventual, o intervalo entre rescisão e recontratação do mesmo profissional precisa de critério.","valor":4910.87},{"tier":"crit","foco":true,"titulo":"Em 22/10 a conta fechou com R$ 4.144,40 e o socorro chegou no dia seguinte","tag":"Caixa","paras":["O saldo do dia 22/10 foi R$ 4.144,40. Em 23/10 entraram R$ 10.000,00 de empréstimo da Ragga MKT & Vendas, que aparecem no extrato em nome de Mel Serviços Administrativos.","É a quarta vez em seis fechamentos que a AVI chega ao limite: R$ 7,89 em 18/09, R$ 7.901,94 em 02/10, R$ 3,60 em 08/10 e agora R$ 4.144,40. Em outubro a conta já recebeu R$ 60.000,00 de empréstimo da MKT — R$ 50.000,00 em 07/10, devolvidos em 14/10, e estes R$ 10.000,00.","A causa segue a mesma e piorou: CMV levou R$ 157.128,22, 84,3% do desembolso, contra 74,3% na janela anterior. O Frigorífico Astra sozinho levou R$ 21.508,01 em duas compras, 19/10 e 22/10, com prazo de sete dias. As entradas cobriram 90,9% das saídas."],"acao":"Esta é a quarta janela seguida com o mesmo diagnóstico. Vale fechar com a diretoria uma decisão: negociar prazo com os três maiores fornecedores de CMV, ou tratar o aporte da MKT como linha permanente de capital de giro, com valor e prazo definidos, em vez de socorro semanal.","valor":4144.4},{"tier":"warn","foco":true,"titulo":"Seis tarifas sem registro, R$ 98,39","tag":"Ajustar registro","paras":["Manutenção de títulos em quatro dias, uma tarifa de baixa e uma de liquidação. Nenhuma tem contrapartida no contas a pagar.","Melhorou bastante: na janela de 03 a 18/10 foram dezenove lançamentos e R$ 489,59, com cesta de relacionamento e integralização de capital. Desta vez não houve nem uma nem outra.","A pendência de criar centro de custo para tarifa bancária segue aberta — é a quinta janela seguida em que ela aparece."],"acao":"Criar o centro de custo e lançar o pacote mensal de tarifas uma vez, nas cinco contas.","valor":98.39},{"tier":"ok","foco":false,"titulo":"Empréstimo de R$ 10.000,00 da MKT amarrado nas duas pontas","tag":"Intercompany","paras":["Os R$ 10.000,00 que entraram em 23/10 são os mesmos que saíram da Ragga MKT & Vendas na mesma data, registrados lá como empréstimo para compor saldo da semana. Valor e data batem.","No extrato da AVI o remetente aparece como MEL SERVIÇOS ADMINISTRATIVOS, CNPJ 57.015.457/0001-97 — o mesmo de-para que já apareceu no empréstimo de R$ 50.000,00 em outubro e no reembolso de sublocação da RETI.","Até 25/10, fim do extrato, o valor não havia sido devolvido."],"acao":"Nenhuma na conciliação. O prazo de devolução está registrado como pendência no fechamento da MKT."},{"tier":"ok","foco":false,"titulo":"Palmieri Foods aparece pela primeira vez como pagadora","tag":"Novo pagador","paras":["Entraram R$ 5.124,24 da PALMIERI FOODS em 23/10 — é o primeiro repasse dessa empresa para a AVI em toda a série. Com ela, os pagadores sobem de 17 para 18.","O nome não é novo no grupo: aparece nos consórcios de van registrados como Fábrica Palmieri e numa viagem de escritório reembolsada na RETI. O que é novo é a Palmieri entrar no fluxo de repasse das lojas."],"acao":"Nenhuma. Vale confirmar se a Palmieri passa a integrar o ciclo normal de repasse, para que o acompanhamento de cobertura das saídas considere 18 pagadoras."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo anterior do extrato, R$ 37.646,30, é idêntico ao saldo final apurado no fechamento de 0 ,"2.482,25"],["Panti Foods","5","2.347,60"],["Bruti Foods","5","2.162,50"],["Japi Foods","5","2.067,90"],["Luama Foods","5","1.428,95"],["Nemaom Foods","5","925,65"]],"foot":["Total recebido","88","121.120,40"]}],"divergencias":[{"tier":"warn","foco":true,"titulo":"Aluguel do Galileu 2 continua saindo para um nome que não está no cadastro","tag":"Cadastrar recebedor","paras":["R$ 8.000,00 registrados como HF Urbanismo foram liquidados em 20/10 para SUPER NOVA ADMINISTRADORA, CNPJ 11.920.152/0001-29. É exatamente o item que levantei no fechamento de 28/09 a 02/10, quando o mesmo recebedor apareceu no aluguel do Galileu 3, de R$ 6.000,00.","Um mês depois, a pendência segue aberta e agora já alcança duas unidades. Enquanto a Super Nova não estiver no cadastro como recebedora da HF Urbanismo, esses aluguéis vão abrir divergência de nome todo mês e consumir tempo da conciliação.","No mesmo dia saíram mais dois aluguéis — Milano R$ 8.000,00 para Aquarius Administração e Biggs e Isaías R$ 15.000,00 para MS Administração Patrimonial. Os três juntos são R$ 31.000,00, 43,1% de tudo que saiu na janela."],"acao":"Incluir Super Nova Administradora no cadastro da HF Urbanismo, com CNPJ. É a segunda vez que registro esse item.","valor":8000.0},{"tier":"warn","foco":true,"titulo":"Treze CNPJ novos e sete alterações de atividade em duas semanas","tag":"Reestruturação societária","paras":["Nesta janela a Metrópole cobrou R$ 1.050,00 pela abertura de três CNPJ — Del Hub, Luvio Consultoria e RP Consultoria — e R$ 3.600,00 pela alteração de atividade de sete empresas: El Hub Foods, Euciva, Madriom, Mapasi, Paladar, MJ Foods e Amege Serviços Terceirizados.","Na janela anterior a RETI já havia pago R$ 1.345,50 pela abertura de dez CNPJ para ajuste gerencial das folhas das lojas. Somando, são treze empresas novas e sete alterações de atividade em duas semanas, R$ 5.995,50 só de taxa.","Duas das novas merecem registro: a Luvio Consultoria é a PJ do Luiz Otávio, que já recebe por ela, e a RP Consultoria recebeu R$ 25.000,00 da Ragga MKT & Vendas em 01/10. Não há nada irregular nisso — o que há é uma estrutura societária crescendo rápido, e a conciliação é onde o custo aparece primeiro."],"acao":"Pedir ao jurídico e à contabilidade o mapa atualizado da estrutura: quais empresas existem, qual a função de cada uma e quais estão ativas. Com 41 CNPJs já citados na adesão à plataforma conciliadora, vale ter isso documentado antes de abrir mais.","valor":5995.5},{"tier":"warn","foco":true,"titulo":"Despesa do apartamento da Dona Amélia classificada como manutenção","tag":"Classificação","paras":["R$ 60,00 de fonte de iluminação para o apartamento da Dona Amélia, sogra do Rafael, saíram em 21/10 classificados como MANUTENÇÃO / ILUMINAÇÃO da MARLAY.","É a segunda ocorrência em duas janelas: em 09/10 saíram R$ 590,00 de fechadura digital para o mesmo apartamento, classificados como Despesas Gerais. E há o empréstimo mensal em nome da Amélia, R$ 1.441,89, esse sim no centro de custo Reset.","Os valores são pequenos e os registros são transparentes — a descrição diz exatamente o que é. O problema é só o centro de custo: despesa de imóvel de familiar não é manutenção da operação nem despesa geral, e misturada com elas distorce os dois."],"acao":"Usar o centro de custo Sócio para esse tipo de despesa, como já é feito com o empréstimo da Amélia. Assim o custo fica visível em um lugar só.","valor":650.0},{"tier":"ok","foco":false,"titulo":"A menor diferença da série: R$ 0,13, sem nenhuma tarifa","tag":"Melhorou","paras":["O único desvio da janela é a Multcabos: registrado R$ 1.311,37, liquidado R$ 1.311,50 em 21/10. É a mesma diferença, no mesmo valor e com o mesmo fornecedor, que apareceu no fechamento de 20 a 25/09 — arredondamento do boleto, não erro de autorização.","O que muda de verdade é o resto: nenhuma tarifa bancária sem registro, nenhuma cesta de relacionamento, nenhuma integralização de capital. Na janela de 03 a 18/10 esta conta teve R$ 179,00 nessas rubricas.","Entre as cinco contas, a diferença total da janela caiu para muito perto de zero."],"acao":"Nenhuma. Se a Multcabos sempre liquida R$ 0,13 acima, vale ajustar o valor de cadastro."},{"tier":"ok","foco":false,"titulo":"Empréstimo de R$ 35.000,00 da MKT amarrado nas duas pontas","tag":"Intercompany","paras":["Os R$ 35.000,00 que entraram em 20/10 são os mesmos que saíram da Ragga MKT & Vendas na mesma data, registrados lá como empréstimo para compor saldo da semana. No extrato da MARLAY o remetente aparece como MEL SERVIÇOS ADMINISTRATIVOS.","A conta abriu a janela com R$ 4.438,29 — o menor saldo da série — e fechou em R$ 53.589,75. O empréstimo e os R$ 20.668,00 da Maanaim responderam por 46,0% de tudo que entrou.","Até 25/10, fim do extrato, o valor não havia sido devolvido."],"acao":"Nenhuma na conciliação. O prazo de devolução está registrado como pendência no fechamento da MKT."},{"tier":"ok","foco":false,"titulo":"Maanaim pela terceira vez, com valor crescente","tag":"Padrão confirmado","paras":["Dois PIX de R$ 10.334,00 em 21/10, R$ 20.668,00 no total. É a terceira ocorrência seguida e o valor sobe a cada vez: R$ 20.000,00 em 22/09, R$ 20.124,00 em 01 e 02/10, R$ 20.668,00 agora.","O padrão é estável — sempre dois PIX iguais, sempre do CNPJ 07.781.598/0001-42 — mas a classificação da receita segue pendente desde o fechamento de 20 a 25/09."],"acao":"Confirmar com o financeiro a que contrato esse repasse corresponde. É o segundo maior crédito individual da conta e já tem três meses de histórico."},{"tier":"ok","foco":false,"titulo":"Multcabos passa a ceder boletos à Gold Credit","tag":"Novo factoring","paras":["O boleto de R$ 872,70 da Multcabos, parcela 1/2 da infraestrutura da Central de Delivery, foi liquidado em 23/10 para GOLD CREDIT SECURITIZADORA. É um cessionário novo na rotina.","Na mesma janela o Gesso Top Line cedeu à Athos Crédito, como já vinha fazendo. Com a Real Forte, a Athos, a RNX FIDC e agora a Gold Credit, são quatro factorings diferentes recebendo por fornecedores do grupo."],"acao":"Nenhuma. Registrar a Gold Credit no de-para da Multcabos."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo anterior do extrato, R$ 4.438,29, é idêntico ao saldo final apurado no fechamento de 03 a 18/10 — o menor da série.","Dentro de 19 a 23/10: R$ 4.438,29 mais R$ 121.120,40 de entradas menos R$ 71.968,94 de saídas dá exatamente os R$ 53.589,75 que o extrato marca em 23/10."],"acao":"Nenhuma."}],"pendencias":3,"pendenciasAbertas":["Cadastrar Super Nova Administradora como recebedora da HF Urbanismo — segunda vez que registro","Pedir ao jurídico o mapa da estrutura societária — 13 CNPJ novos em duas semanas","Mover para o centro de custo Sócio as despesas do apartamento da Dona Amélia"],"composicaoDif":[{"tipo":"maior","dt":"21/10","desc":"Multcabos — registrado R$ 1.311,37, pago R$ 1.311,50","v":0.13}],"wpp":"*CONCILIAÇÃO SEMANAL — MARLAY (ML Consultoria)*\nPeríodo: 19 a 23/10/2026 · Conta Sicredi 66328-3\n\n*Resultado:* 28 de 28 registros conciliados. Continuidade exata.\n\n• Contas a pagar registrado: R$ 71.968,81\n• Débitos no banco: R$ 71.968,94\n• Diferença: *R$ 0,13* — um boleto da Multcabos pago acima do registrado. *Nenhuma tarifa sem registro*\n• Saldo: R$ 4.438,29 -> R$ 53.589,75\n\n*A CONTA SE RECOMPÔS*\nAbriu a janela com R$ 4.438,29, o menor saldo da série, e fechou em R$ 53.589,75. O empréstimo de R$ 35.000,00 da MKT e os R$ 20.668,00 da Maanaim responderam por 46,0% do que entrou.\n\n*Pontos para tratar:*\n1. *Aluguel do Galileu 2* (R$ 8.000,00) registrado como HF Urbanismo e pago para Super Nova Administradora. É a *segunda vez* que registro — em 02/10 foi o Galileu 3. Cadastrar a recebedora\n2. *Treze CNPJ novos e sete alterações de atividade em duas semanas*, R$ 5.995,50 de taxa: 3 aqui (Del Hub, Luvio, RP Consultoria) + 10 pela RETI na janela anterior. Vale pedir ao jurídico o mapa atualizado da estrutura, já que a adesão à plat ercompany em aberto","paras":["R$ 35.000,00 para a ML Consultoria em 20/10 e R$ 10.000,00 para a AVI em 23/10, os dois registrados como empréstimo para compor saldo da semana. Juntos são 62,3% de tudo que saiu da conta na janela.","Somando o mês, a MKT & Vendas já emprestou R$ 95.000,00 a outras empresas do grupo: R$ 50.000,00 à AVI em 07/10, devolvidos em 14/10, mais estes dois. Até 25/10, que é onde o extrato termina, nenhum dos R$ 45.000,00 tinha voltado.","Os dois destinos conversam com o que a conciliação já mostrou: a MARLAY fechou 16/10 com R$ 4.438,29 e a AVI chegou a R$ 3,60 em 08/10. O empréstimo não é improviso, é o grupo cobrindo duas contas que vêm operando sem margem — e a MKT é quem tem caixa para isso."],"acao":"Definir prazo de devolução dos R$ 45.000,00 e registrar no contas a pagar das duas empresas como obrigação, não como ajuste. Se o socorro virar rotina, vale tratar como linha própria no fluxo de caixa do grupo em vez de ajuste entre contas.","valor":45000.0},{"tier":"warn","foco":true,"titulo":"R$ 3.798,97 que o próprio registro declara sem correspondência","tag":"Explicar","paras":["Entre os doze lançamentos de B2B da janela há um de R$ 3.798,97 descrito como \"demais consumos sem correspondência confirmada na base de MKT\". É o segundo maior do bloco e 20,6% de todo o B2B do período.","Os outros onze são rastreáveis: cada um nomeia a ação, a loja e a data — Reels do Dia do Cachorro-quente, gravação com a ginasta Luiza Murata, sessão de fotos com a agência Seta, e assim por diante. Esse não.","O pagamento está conciliado e saiu junto com os demais no PIX à Gamel. O que falta é saber a que consumo ele corresponde, porque hoje o próprio registro diz que não se sabe."],"acao":"Pedir ao MKT o detalhamento desses R$ 3.798,97. Se não houver base, vale decidir se o consumo continua sendo absorvido ou se passa a exigir correspondência antes do pagamento.","valor":3798.97},{"tier":"warn","foco":true,"titulo":"R$ 10.069,38 de consumo liberado a funcionários num único dia","tag":"Conferir natureza","paras":["O maior lançamento de B2B da janela é o consumo de parmegiana liberado aos funcionários pelo Luiz Otávio em 15/09, R$ 10.069,38. Saiu em 20/10, 35 dias depois do consumo.","É mais da metade de todo o B2B do período e está classificado junto com gravações de conteúdo e fotos de produto, que são despesa de marketing. Benefício a funcionário e produção de conteúdo são naturezas diferentes e deveriam aparecer separadas.","O valor por si não é problema — o que chama atenção é um evento único de confraternização custar mais do que toda a produção de conteúdo da janela somada."],"acao":"Separar em centro de custo próprio o consumo liberado a funcionários, e fechar esse tipo de consumo no mês em que acontece.","valor":10069.38},{"tier":"warn","foco":true,"titulo":"Verba de tráfego registrada na Setalab e paga direto à Meta","tag":"Cadastrar recebedor","paras":["R$ 1.500,00 de tráfego do Rob's estão registrados no fornecedor Setalab e saíram em 19/10 para FACEBOOK SERVIÇOS ONLINE DO BRASIL. A agência aparece no cadastro, o recebedor é a plataforma.","Não há erro no pagamento — a verba de mídia é mesmo paga à plataforma. O que não existe é o de-para, então todo mês esse lançamento vai abrir divergência de nome.","No mesmo dia a Setalab recebeu de fato R$ 6.890,00 de honorários da agência, esses sim no próprio nome, dois dias depois do vencimento de 17/10."],"acao":"Separar no cadastro honorário de agência e verba de mídia, com o recebedor correto em cada um.","valor":1500.0},{"tier":"ok","foco":false,"titulo":"Catorze registros liquidados em dois pagamentos","tag":"Conferido","paras":["Os doze lançamentos de B2B somam R$ 18.401,34 e saíram num único PIX para a Gamel Serviços Terceirizados em 20/10. Os dois reembolsos da Carolina Matsumoto, R$ 102,88 de benchmark no Madero e R$ 45,92 de deslocamento, somam R$ 148,80 e saíram num PIX para a CBM Consultoria em 19/10.","As duas somas fecham no centavo. Vale registrar que o ,"3.758,25","0,02"],["Pigui Foods","3.304,20","3.304,20","0,00"],["Veri Foods","3.188,16","3.188,15","0,01"],["Panti Foods","2.623,74","2.623,75","-0,01"],["Bruti Foods","2.486,61","2.486,60","0,01"],["Madri Foods","2.457,99","2.458,00","-0,01"],["Japi Foods","2.318,38","2.318,40","-0,02"],["Luama Foods","1.719,17","1.719,15","0,02"],["Nemaom Foods","899,54","899,55","-0,01"]],"foot":["Total","70.351,77","70.351,75","0,02"]}],"divergencias":[{"tier":"crit","foco":true,"titulo":"Os R$ 70.351,77 das lojas agora estão dentro da janela e seguem sem explicação","tag":"Segunda cobrança","paras":["Levantei isso no fechamento de 03 a 18/10, quando o crédito ainda estava fora do período. Agora ele entra na conciliação: em 22/10 as 17 lojas transferiram R$ 70.351,77 para esta conta — quase catorze vezes tudo o que saiu no período — e o saldo saltou 121,2%.","A comparação loja a loja continua valendo e está no anexo: são os mesmos valores que a MARLAY recebeu em 20–25/09, nenhum diferindo mais de dez centavos, agregado batendo em dois centavos. Antes desta série a Ragga Social nunca havia recebido repasse de loja.","Enquanto não houver resposta, o fechamento registra uma entrada de setenta mil reais numa conta cuja razão social é GDX Manutenções e Serviços, sem contrato identificado e sem classificação de receita. É a maior pendência aberta da rotina hoje."],"acao":"Preciso de uma definição: a que título as 17 lojas repassaram esse valor, se houve decisão formal de mudar o destinatário e qual o documento que ampara. Com a resposta eu classifico a receita e encerro o item; sem ela, ele segue aberto em todos os fechamentos.","valor":70351.77},{"tier":"warn","foco":true,"titulo":"Consumo de terceiros em lojas do grupo classificado como B2B","tag":"Classificação","paras":["Onze dos treze registros da janela são consumo em unidades do grupo atribuído a pessoas nomeadas — Pastor Neto na Biggs 01, 03 e 06 e na Isaías 03, Pastor Silas IPI na Mapoli, Biggs 05 e 06 e na Isaías 03 — mais duas doações feitas por Luiz Otávio, uma ao Teatro Nissi (R$ 393,00) e outra a um terceiro (R$ 82,25).","Tudo está registrado, liquidado num único PIX para a Gamel e confere no centavo. O que não encaixa é o centro de custo: B2B descreve operação entre empresas, e o que está aqui é cortesia de consumo e doação pessoal. Quem ler o contas a pagar sem abrir a descrição entende outra coisa.","O registro da Mapoli refere-se a uma compra de 21/09 liquidada em 20/10 — quase um mês depois. Se esse consumo é concedido de forma contínua, vale fechar mês a mês para não acumular."],"acao":"Criar centros de custo que descrevam o que são: um para cortesia de consumo em loja e outro para doação. E definir se as doações pessoais do sócio devem transitar por esta conta ou ser reembolsadas.","valor":3074.46},{"tier":"warn","foco":false,"titulo":"O dado de saúde continua na descrição do contas a pagar","tag":"LGPD","paras":["A parcela 2/2 da ajuda de custo de R$ 1.550,02, paga em 19/10, mantém no campo de descrição o detalhe do procedimento médico de uma pessoa nomeada. É o mesmo registro que apontei no fechamento anterior, agora na segunda parcela.","O pagamento está correto e conciliado. O problema é o campo livre: dado de saúde é dado pessoal sensível pelo artigo 11 da LGPD e o contas a pagar circula aberto.","Como a parcela era 2/2, o registro encerra aqui — mas o texto fica no histórico da planilha."],"acao":"Substituir a descrição nas duas parcelas por algo genérico e guardar a justificativa em local de acesso restrito."},{"tier":"ok","foco":false,"titulo":"Onze registros liquidados num único PIX","tag":"Conferido","paras":["Os onze lançamentos de B2B somam R$ 3.074,46 e saíram em uma única transferência para a Gamel Serviços Terceirizados em 20/10. A soma fecha no centavo e nenhum outro débito do dia ficou sem par.","É o mesmo arranjo já confirmado nas semanas anteriores: Grupo Londrino liquida pela Gamel."],"acao":"Nenhuma."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo de abertura, R$ 53.857,88, é idêntico ao saldo final apurado no fechamento de 03 a 18/10.","Dentro de 19 a 23/10: R$ 53.857,88 mais R$ 70.351,77 das lojas mais R$ 2,43 de rendimento menos R$ 5.097,05 de saídas dá exatamente os R$ 119.115,03 que o extrato marca em 22/10. Nenhum débito ficou sem registro — nem tarifa."],"acao":"Nenhuma."}],"pendencias":2,"pendenciasAbertas":["Definir a que título as 17 lojas repassaram R$ 70.351,77 para esta conta — segunda cobrança","Reclassificar os 11 registros de B2B: cortesia de consumo e doação não são operação entre empresas"],"composicaoDif":[],"wpp":"*CONCILIAÇÃO SEMANAL — RAGGA SOCIAL*\nPeríodo: 19 a 23/10/2026 · Nubank 990919024-0\n\n*Resultado:* 13 de 13 registros conciliados, *diferença zero*. Continuidade exata e nenhum débito no extrato sem registro — nem tarifa.\n\n• Contas a pagar registrado: R$ 5.097,05\n• Débitos no banco: R$ 5.097,05\n• Saldo: R$ 53.857,88 -> R$ 119.115,03 (+121,2%)\n\n*PONTO QUE SEGUE SEM RESPOSTA*\nEm 22/10 as 17 lojas repassaram *R$ 70.351,77* para esta conta — quase catorze vezes tudo o que saiu na janela. Levantei isso no fechamento anterior, quando o crédito ainda estava fora da janela; agora ele está dentro.\nA comparação loja a loja continua valendo: são os mesmos valores que a MARLAY recebeu em 20 a 25/09 (R$ 70.351,75), nenhum diferindo mais de dez centavos. Antes desta série a Ragga Social nunca recebeu repasse de loja.\nPreciso saber a que título o repasse veio e se houve decisão formal de mudar o destinatário, para classificar a receita.\n\n*Outro ponto:*\nOnze dos treze registros são consumo em lojas do grupo atribuído a pessoas nomeadas, mais duas doações pessoais, tudo classificado como *B2B*. Está correto e conciliado, mas o centro de custo não descreve o que é — cortesia de consumo e doação não são operação entre empresas."},{"id":"avi-2026-10-03","ordem":20261003,"conta":"avi","contaLabel":"AVI","contaDetalhe":"Vespa  no contas a pagar.","Somam-se a eles R$ 100,00 de integralização de capital subscrito, debitada pelo Sicredi em 13/10 — o mesmo lançamento que apareceu na MARLAY no mesmo dia — e R$ 0,01 pagos acima do registrado na Personalize Papéis.","É o quarto fechamento seguido em que tarifa bancária sai sem registro, e o maior volume até agora. O valor é pequeno em si, mas ele aparece na conciliação exatamente como apareceria uma saída não autorizada, e isso custa tempo a cada fechamento."],"acao":"Criar centro de custo para tarifa bancária e lançar o pacote mensal uma vez, em vez de deixar 19 lançamentos órfãos. Registrar também a integralização de capital e ajustar o R$ 0,01 da Personalize.","valor":489.59},{"tier":"warn","foco":true,"titulo":"O empréstimo de R$ 50.000,00 entrou e saiu em nome de Mel Serviços Administrativos","tag":"Confirmar cadastro","paras":["O contas a pagar registra a devolução como RAGGA MKT&VENDAS. No extrato da AVI, os R$ 50.000,00 entraram em 07/10 e saíram em 14/10 em nome de MEL SERVIÇOS ADMINISTRATIVOS, CNPJ 57.015.457/0001-97.","As duas pontas fecham: no extrato da Ragga MKT & Vendas o valor sai em 07/10 para a AVI e volta em 14/10, nas mesmas datas e no mesmo valor. A operação está correta e já está amarrada nos dois fechamentos.","O que falta é o cadastro dizer isso. A descrição do reembolso de aluguel da MKT, naquele mesmo período, menciona que \"MEL realiza o pagamento como sublocação\" — o que reforça que Mel Serviços é a razão social por trás da conta da MKT & Vendas, mas isso precisa ser confirmado, não deduzido."],"acao":"Confirmar se Mel Serviços Administrativos Ltda é a razão social da conta Ragga MKT & Vendas e registrar o de-para. É o mesmo tipo de lacuna encontrado na Ragga Social, que opera sob GDX Manutenções.","valor":50000.0},{"tier":"warn","foco":true,"titulo":"R$ 2.116,77 em multas e licenciamentos do Detran, oito multas de ex-funcionários","tag":"Recuperação","paras":["Saíram em 07/10, agrupados em dois pagamentos ao Departamento de Trânsito do Paraná: R$ 1.789,16 e R$ 327,61. São sete multas, duas delas por não identificação do condutor infrator, e dois licenciamentos de 2026 (van SFH-7I53 e caminhão FCI-7D36).","As infrações são de janeiro, maio, outubro e dezembro de 2025 e de fevereiro de 2026, e os próprios registros dizem que foram recebidas por dois ex-funcionários, Tadeu e Gilmar. As duas por não identificação do condutor custam R$ 819,57 — são as mais caras justamente porque ninguém foi indicado no prazo.","Pagar é obrigação da empresa, que é a proprietária dos veículos. O ponto é que multa de condutor identificável é recuperável, e multa por não identificação é um custo que só existe por falha de processo interno."],"acao":"Definir um procedimento: toda notificação do Detran indica o condutor dentro do prazo e a multa é descontada ou cobrada de quem dirigia. Vale levantar se há mais notificações pendentes dos mesmos veículos.","valor":2116.77},{"tier":"ok","foco":false,"titulo":"Folha de R$ 16.383,56 aberta em cinco PIX","tag":"Conferido","paras":["O contas a pagar traz a folha como um registro só, R$ 16.383,56 em 06/10. No extrato ela sai em cinco PIX a funcionários: Marilza Machado R$ 4.564,61, Luiz Eduardo de Almeida R$ 4.541,22, Igor Rafael de Almeida R$ 4.378,64, Claudecir Pereira de Lima R$ 2.206,32 e Diego Rocha de Araújo R$ 692,77.","A soma dos cinco é exatamente R$ 16.383,56. Nenhum outro lançamento do dia ficou sem par, então a amarração é por eliminação e fecha no centavo."],"acao":"Nenhuma."},{"tier":"warn","foco":false,"titulo":"CMV de R$ 314.772,08 em duas semanas, com prazos curtos","tag":"Leitura","paras":["Mercadoria respondeu por 74,3% do que saiu da conta: 141 registros e R$ 314.772,08 em duas semanas. O Frigorífico Astra sozinho levou R$ 29.131,90 em dois pagamentos dentro da janela (R$ 14.725,21 em 08/10 e R$ 14.406,69 em 15/10), mais R$ 13.025,93 em 19/10 — R$ 42.157,83 em três semanas, com prazo de sete dias.","Os repasses das lojas, R$ 403.899,81, cobriram 95,2% das saídas da janela. A folga veio do empréstimo. Esse é o número que explica por que o saldo diário oscila entre R$ 3,60 e R$ 85 mil."],"acao":"Nenhuma na conciliação. Vale negociar prazo com os três maiores fornecedores de CMV, começando pelo Astra."},{"tier":"ok","foco":false,"titulo":"Continuidade e amarração de saldo exatas","tag":"Conferido","paras":["O saldo em 02/10 no extrato, R$ 7.901,94, é idêntico ao saldo final apurado no fechamento de 28/09–02/10.","Dentro de 03 a 18/10: R$ 7.901,94 mais R$ 453.899,81 de entradas menos R$ 424.155,45 de saídas dá exatamente os R$ 37.646,30 que o extrato marca em 16/10. Todos os 191 registros da janela foram localizados."],"acao":"Nenhuma."}],"pendencias":4,"pendenciasAbertas":["Criar centro de custo para tarifa bancária — 19 lançamentos órfãos nesta janela (R$ 389,58)","Levar o descasamento entre prazo de CMV e repasse das lojas à diretoria — a conta chegou a R$ 3,60","Confirmar se Mel Serviços Administrativos é a razão social da conta Ragga MKT & Vendas","Definir procedimento de indicação de condutor nas multas do Detran"],"composicaoDif":[{"tipo":"sem-registro","dt":"05/10","desc":"Tarifa Baixa De Titulos Cob000001","v":0.6},{"tipo":"sem-registro","dt":"05/10","desc":"Manutencao De Titulos Cob000132","v":79.2},{"tipo":"sem-registro","dt":"05/10","desc":"Tarifa Com R Liquidacao Cob000005","v":5.95},{"tipo":"sem-registro","dt":"06/10","desc":"Manutencao De Titulos Cob000056","v":33.6},{"tipo":"sem-registro","dt":"06/10","desc":"Tarifa Com R Liquidacao Cob000001","v":1.19},{"tipo":"sem-registro","dt":"07/10","desc":"Tarifa Baixa De Titulos Cob000001","v":0.6},{"tipo":"sem-registro","dt":"07/10","desc":"Manutencao De Titulos Cob000063","v":37.8},{"tipo":"sem-registro","dt":"08/10","desc":"Manutencao De Titulos Cob000028","v":16.8},{"tipo":"sem-registro","dt":"08/10","desc":"Tarifa Com R Liquidacao Cob000001","v":1.19},{"tipo":"sem-registro","dt":"09/10","desc":"Manutencao De Titulos Cob000023","v":13.8},{"tipo":"sem-registro","dt":"13/10","desc":"Tarifa Baixa De Titulos Cob000003","v":1.8},{"tipo":"sem-registro","dt":"13/10","desc":"Manutencao De Titulos Cob000105","v":63.0},{"tipo":"sem-registro","dt":"13/10","desc":"Integr.Capital Subscrito","v":100.0},{"tipo":"sem-registro","dt":"13/10","desc":"Aluguel Maq Cartoes","v":8.88},{"tipo":"sem-registro","dt":"13/10","desc":"Tarifa Com R Liquidacao Cob000002","v":2.38},{"tipo":"sem-registro","dt":"13/10","desc":"Tarifa Com R Liquidacao Cob000001","v":1.19},{"tipo":"sem-registro","dt":"14/10","desc":"Manutencao De Titulos Cob000030","v":18.0},{"tipo":"sem-registro","dt":"15/10","desc":"Manutencao De Titulos Cob000023","v":13.8},{"tipo":"sem-registro","dt":"15/10","desc":"Cesta De Relacionamento","v":79.0},{"tipo":"sem-registro","dt":"16/10","desc":"Manutencao De Titulos Cob000018","v":10.8},{"tipo":"maior","dt":"06/10","desc":"Personalize Papéis — registrado R$ 1.393,87, pago R$ 1.393,88","v":0.01}],"wpp":"*CONCILIAÇÃO SEMANAL — AVI (Ragga Insumos Vespa)*\nPeríodo: 03 a 18/10/2026 · Conta Sicredi 65745-8\n\n*Resultado:* 191 de 191 registros conciliados. Continuidade exata com o fechamento anterior.\n\n• Contas a pagar registrado: R$ 423.665,86\n• Débitos no banco: R$ 424.155,45\n• Diferença: R$ 489,59 — 19 tarifas bancárias, integralização de capital e R$ 0,01\n• Saldo: R$ 7.901,94 -> R$ 37.646,30\n\n*ALERTA: EM 08/10 A CONTA FECHOU O DIA COM R$ 3,60*\nNaquele dia saíram R$ 43.297,50 em 22 lançamentos. O que impediu os boletos de voltarem foi o empréstimo de R$ 50.000,00 que entrou na véspera e foi devolvido em 14/10.\nÉ a terceira vez em cinco fechamentos que a AVI chega ao fim de uma janela sem caixa: R$ 7,89 em 18/09, R$ 7.901,94 em 02/10 e R$ 3,60 em 08/10.\n\n*Pontos para tratar:*\n1. *CMV de R$ 314.772,08 em duas semanas* — 74,3% do desembolso. O Frigorífico Astra levou R$ 42.157,83 em três semanas com prazo de 7 dias. É o descasamento entre prazo de fornecedor e repasse das lojas que deixa a conta no limite\n2. *19 tarifas bancárias sem registro* (R$ 389,58) — 4º fechamento seguido. Criar centro de custo resolve\n3. *R$ 2.116,77 em multas e licenciamentos do Detran:* 7 multas, duas por não identificação do condutor (R$ 819,57), recebidas por dois ex-funcionários. Multa por não identificação é custo que só existe por falha de processo\n4. O empréstimo de R$ 50.000,00 entrou e saiu em nome de *Mel Serviços Administrativos* — confirmar se é a razão social da conta Ragga MKT & Vendas\n\n*Fechado:* o empréstimo está amarrado nas duas pontas, saiu da MKT em 07/10 e voltou em 14/10."},{"id":"marlay-2026-10-03","ordem":20261003,"conta":"marlay","contaLabel":"MARLAY","contaDetalhe":"ML Consultoria · Sicredi 66328-3","cor":"#5B3E8E","razaoSocial":"ML Consultoria em Food Service Ltda","periodoLabel":"03/10–18/10/2026","periodoInicio":"2026-10-03","periodoFim":"2026-10-18","emitido":"2026-10-23","semana":"41 e 42","chamada":"64 de 64 registros conciliados e continuidade exata, mas a conta terminou a janela com R$ 4.438,29. Saíram R$ 183.205,39 contra R$ 106.739,90 que entraram — uma queima de R$ 76.465,49, e o saldo caiu 94,5%. Duas adesões de franquia foram pagas aqui dentro, com R$ 25.000,00 de segunda parcela ainda a vencer.","saldoAnterior":80903.78,"debitos":183205.39,"creditos":106739.9,"saldoFinal":4438.29,"saldoInformado":4438.29,"totalCP":183026.39,"debitoLiquido":183205.39,"diferenca":179.0,"registros":64,"conciliados":64,"lancamentos":160,"tarifasTotal":79.0,"creditosLojas":106739.9,"kpis":[{"k":"Conciliado","v":"64 / 64","d":"100% dos registros localizados no extrato","tone":"hero"},{"k":"Diferença não registrada","v":"179,00","d":"2 débitos do banco sem contrapartida","tone":"warn","drill":"dif"},{"k":"Queima de caixa","v":"−76.465,49","d":"Saídas superaram as entradas","tone":"crit"},{"k":"Saldo em 16/10","v":"4.438,29","d":"−94,5% · menor saldo da série","tone":"crit"}],"leitura":[{"txt":"Conciliados 1:1 com o extrato","nota":"Mesmo valor e mesma data de pagamento","n":"64","v
